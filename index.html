<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<title>Isaac's Learning Lab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M32 3l25 9v17c0 16-11 27-25 32C18 56 7 45 7 29V12z%22 fill=%22%23c62828%22 stroke=%22%231e3a8a%22 stroke-width=%224%22/%3E%3Cpath d=%22M20 22h24l-4 8h-16zM18 34l14 14 14-14-6-2-8 8-8-8z%22 fill=%22%23cfd8e3%22/%3E%3Ccircle cx=%2226%22 cy=%2226%22 r=%222%22 fill=%22%234fc3f7%22/%3E%3Ccircle cx=%2238%22 cy=%2226%22 r=%222%22 fill=%22%234fc3f7%22/%3E%3C/svg%3E">
<style>:root{--ink:#1d2340;--muted:#4a5072;--bg:#fff8ec;--card:#fff;--brand:#5b4bdb;--ok:#127a44;--bad:#b42318;--r:20px;
--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:18px;line-height:1.5;
background-image:radial-gradient(circle at 10% 0,#ffe3f1 0,transparent 40%),radial-gradient(circle at 100% 30%,#dff3ff 0,transparent 40%);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,248,236,.92);backdrop-filter:blur(6px);border-bottom:2px solid #f1e4cc}
.back{min-width:48px;min-height:48px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 0 #e6d6b8;font-weight:700;font-size:20px;padding:0 14px}
.back[hidden]{display:none}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:800;font-size:20px;flex:1;min-height:48px}
.brand img{width:40px;height:40px;object-fit:contain}
.starcount{font-weight:800;background:#fff3c4;color:#6b4e00;border-radius:999px;padding:8px 14px;min-height:40px}
main{max-width:980px;margin:0 auto;padding:16px 16px 80px;outline:none}
h1{font-size:30px;line-height:1.2;margin:8px 0 12px}
h2{font-size:23px;margin:22px 0 10px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#6d5df5,#4338ca);color:#fff;border-radius:28px;padding:18px;box-shadow:0 8px 24px rgba(67,56,202,.25)}
.hero img{width:120px;height:auto;flex:none;background:#fffdf5;border-radius:22px;padding:8px}
.hero h1{margin:0 0 6px;color:#fff}
.hero p{margin:0}
.badge-level{display:inline-block;background:#ffd23f;color:#3b2c00;font-weight:900;border-radius:12px;padding:2px 12px;margin-bottom:6px;letter-spacing:.5px}
.tiles{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
@media(min-width:600px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:first-child{grid-column:1/-1}}
@media(min-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;align-items:center;gap:14px;min-height:110px;padding:18px;border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--c);box-shadow:0 6px 0 var(--c);transition:transform .15s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.tile .ic{font-size:44px;width:70px;height:70px;display:grid;place-items:center;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,white)}
.tile b{display:block;font-size:24px}
.tile small{color:var(--muted);font-size:16px}
.big{min-height:140px}
.section{background:#fff;border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.section h2{margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;background:#eef;color:#3730a3}
.tag.sample{background:#ffe8cc;color:#7a3e00}
.muted{color:var(--muted)}
.topic{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;margin-top:8px;border-radius:16px;background:#f6f4ff;text-decoration:none;color:var(--ink);font-weight:700}
.topic .st{margin-left:auto;color:#8a6100;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;min-width:56px;padding:0 22px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 0 #3b2fa8;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2fa8}
.btn.ghost{background:#fff;color:var(--brand);box-shadow:0 4px 0 #d7d2ff;border:2px solid #d7d2ff}
.btn.ok{background:#12804a;box-shadow:0 4px 0 #0b5a33}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lesson p{font-size:20px;margin:8px 0}
.zhcard{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:#fff4f4;border-radius:14px;padding:10px 14px;margin:8px 0}
.zh{font-size:30px;font-weight:700}
.py{color:#8a1c1c;font-size:18px}
.en{color:var(--muted)}
.exp{background:#eafaf1;border:2px dashed #2bb673;border-radius:var(--r);padding:14px;margin-top:14px}
.exp h3{margin:10px 0 4px;font-size:19px}
.exp ul,.exp ol{margin:4px 0;padding-left:24px}
.passage{background:#fffdf3;border-left:6px solid #f59e0b;border-radius:12px;padding:6px 16px;font-size:19px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#ddd}
.dots i.on{background:var(--brand)}.dots i.done{background:#f5b800}
.prompt{font-size:22px;font-weight:700;margin:10px 0}
.opts{display:grid;gap:10px}
@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:64px;text-align:left;padding:12px 16px;border-radius:16px;border:3px solid #d9d6f5;background:#fff;font-size:20px;font-weight:600;display:flex;flex-direction:column;justify-content:center}
.opt.right{border-color:var(--ok);background:#e6f7ee}
.opt.wrong{border-color:var(--bad);background:#fdecea;text-decoration:line-through}
.opt .zh{font-size:26px}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans input{flex:1;min-width:160px;min-height:60px;font-size:24px;padding:8px 14px;border-radius:14px;border:3px solid #d9d6f5}
.fb{margin-top:14px;border-radius:16px;padding:12px 16px;font-weight:700;font-size:19px}
.fb.ok{background:#e6f7ee;color:#0b5a33}
.fb.bad{background:#fff4e5;color:#7a3e00}
.fb .hint{font-weight:500}
.steps{background:#f3f1ff;border-radius:16px;padding:12px 16px;margin-top:12px}
.steps ol{margin:6px 0;padding-left:24px}
.steps li{margin:4px 0}
.stars{font-size:28px;color:#e0a800;letter-spacing:2px}
.stars .off{color:#d6d6d6}
.bm{width:100%;max-width:620px;height:auto;display:block;margin:8px 0;background:#fff;border-radius:14px}
.badgecard{text-align:center;background:#fff;border-radius:28px;padding:24px;border:4px solid #ffd23f}
.badgecard .medal{font-size:84px}
.badgecard img{width:140px}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badges span{background:#fff;border:2px solid #ffd23f;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
/* comic */
.ctool{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.strip{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.strip.n3{grid-template-columns:repeat(3,1fr)}.strip.n4{grid-template-columns:repeat(2,1fr)}}
.panel{position:relative;aspect-ratio:4/3;background:#fff;border:4px solid var(--ink);border-radius:8px;overflow:hidden;touch-action:none}
.panel.sel{outline:4px solid #ffb703}
.item{position:absolute;transform:translate(-50%,-50%);user-select:none;touch-action:none;cursor:grab}
.item.sel{outline:3px dashed #5b4bdb;outline-offset:3px}
.item.bubble{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:6px 12px;font-weight:700;font-size:16px;max-width:60%;text-align:center}
.item.bubble::after{content:"";position:absolute;left:30%;bottom:-14px;border:8px solid transparent;border-top:12px solid var(--ink)}
.item.caption{background:#ffe680;border:2px solid var(--ink);padding:4px 10px;font-size:15px;font-weight:700;max-width:80%}
.item.char img{display:block;width:auto;height:var(--h,90px);pointer-events:none}
.editbox{background:#fff;border-radius:16px;padding:12px;margin-top:10px}
.editbox textarea{width:100%;min-height:70px;font-size:19px;border-radius:12px;border:3px solid #d9d6f5;padding:8px}
.chars{display:flex;gap:8px}
.chars button{width:72px;height:72px;border-radius:14px;border:3px solid #d9d6f5;background:#fff;padding:4px}
.chars img{max-width:100%;max-height:100%}
.tzh{font-weight:600;font-size:.8em;color:var(--muted)}
.tiles.two{grid-template-columns:1fr}
@media(min-width:600px){.tiles.two{grid-template-columns:1fr 1fr}.tiles.two .tile:first-child{grid-column:auto}}
.tile.theme{background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--c) 12%,white))}
.foot{margin-top:40px;padding:16px;border-top:2px dashed #e6d6b8;font-size:15px;text-align:center}
.foot p{margin:4px 0}.foot a{color:#3b2fa8;font-weight:700}
.label{font-size:15px;color:#5a4a00;background:#fff6cf;border-radius:10px;padding:6px 10px;display:inline-block}
.crumb{color:var(--muted);font-weight:700;margin:0}
.tag.bonus{background:#e0f2fe;color:#075985}
.section.bonus{border:3px dashed #38bdf8}
.syl{display:block;font-weight:500;color:var(--muted);font-size:14px}
.card{background:#f0f9ff;border-radius:14px;padding:10px 14px;margin-top:8px}.card p{margin:4px 0}
.topic.tool{background:#fde7f3}
.fact{background:#fff6cf;border-radius:14px;padding:10px 14px}
.safety{background:#fff1f0;color:#8a1c1c;border-radius:12px;padding:8px 12px;font-weight:600}
.chip{display:inline-block;background:#fff;border:2px solid #f5c26b;border-radius:999px;padding:2px 10px;margin:2px;font-size:16px}
details{margin:8px 0;background:#fff;border-radius:12px;padding:6px 12px}
summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.ex{width:100%;font-size:17px}
.guide{display:flex;gap:12px;align-items:center;background:#fff;border-radius:var(--r);padding:12px}
.guide img{width:90px;flex:none}
.say{background:#f3f1ff;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:17px}
.lead{font-size:20px}
.path{background:#fff;border-radius:14px;padding:10px 14px;margin:12px 0}
.pbar{display:block;height:14px;background:#eee;border-radius:9px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#f5b800,#f97316)}
.vgrid{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:700px){.vgrid{grid-template-columns:1fr 1fr}}
.video{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#1d2340}
.video iframe{width:100%;height:100%;border:0}
.vthumb{position:relative;width:100%;height:100%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;padding:12px;background:radial-gradient(circle at 30% 20%,#6d5df5,#1d2340)}
.video.empty .vthumb{background:repeating-linear-gradient(45deg,#eef,#eef 12px,#e4e2ff 12px,#e4e2ff 24px);color:var(--ink)}
.vic{font-size:44px;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.ptag{position:absolute;top:10px;left:10px;background:#ffd23f;color:#3b2c00;font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px}
.tap{font-size:14px;opacity:.9}
.links li{margin:8px 0}.links a{color:#3b2fa8;font-weight:700}
.sr{position:absolute;left:-9999px}
.bname{font-size:24px;font-weight:800;color:#7a4b00}
select{font:inherit;min-height:48px;border-radius:12px;border:3px solid #d9d6f5;padding:0 8px;max-width:100%}
.pnum{position:absolute;left:6px;top:4px;font-weight:800;color:#9aa0c0;font-size:14px}
.chb{padding:4px 10px}.chb img{height:44px}
.item.bubble,.item.caption{z-index:2}.item.char{z-index:1}.item.bubble{min-width:110px}
.rsvg{width:100%;height:auto;max-width:150px;color:#1d2340;display:block;margin:0 auto}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.hgrid{grid-template-columns:repeat(4,1fr)}}
.hcard{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hcard b{display:block}.hcard small{color:var(--muted);font-size:14px}
.hcard.locked .rsvg{filter:brightness(0);opacity:.18}
.xform{position:relative;height:200px;max-width:260px;margin:0 auto}
.xform .xa,.xform .xb{position:absolute;inset:0 0 40px;display:grid;place-items:center}
.xform .rsvg{max-width:160px}
.xa{animation:xout 1.4s ease-in forwards}.xb{opacity:0;animation:xin 1.4s ease-out .9s forwards}
@keyframes xout{0%{transform:none}40%{transform:rotate(-8deg) scale(1.05)}100%{transform:rotate(180deg) scale(0);opacity:0}}
@keyframes xin{0%{opacity:0;transform:scale(.2) rotate(-180deg)}70%{transform:scale(1.1)}100%{opacity:1;transform:none}}
.burst{position:absolute;left:50%;top:40%;width:20px;height:20px;margin:-10px;border-radius:50%;box-shadow:0 0 0 0 #ffd23f;animation:burst 1s ease-out .7s}
@keyframes burst{0%{box-shadow:0 0 0 0 rgba(255,210,63,.9)}100%{box-shadow:0 0 0 90px rgba(255,210,63,0)}}
.xt{position:absolute;bottom:0;left:0;right:0;text-align:center;font-weight:800;margin:0}
@media (prefers-reduced-motion:reduce){.xform .xa{display:none}.xform .xb{opacity:1;animation:none}.xform .burst{display:none}}
.overlay{position:fixed;inset:0;background:rgba(29,35,64,.55);z-index:20;display:grid;place-items:center;padding:16px}
.ovc{background:#fff;border-radius:28px;padding:20px;max-width:360px;width:100%;text-align:center}
.boss{display:flex;gap:10px;align-items:center;background:#fff1f2;border:3px solid #fb7185;border-radius:18px;padding:8px 12px;margin:8px 0}
.kingwrap{width:72px;flex:none}.kingwrap .rsvg{max-width:72px}
.kingbob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.hp{display:block;height:12px;background:#fecdd3;border-radius:8px;margin-top:6px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#e11d48;transition:width .6s}
.boss.beaten .hp i{width:0}.boss.beaten .kingwrap{animation:flee .8s forwards}@keyframes flee{to{transform:translateX(-60px) rotate(-20deg);opacity:.2}}
.xform,.xform *{pointer-events:none}
.ovc #ovx{position:relative;z-index:5}

.tag.lv-challenge{background:#ffedd5;color:#9a3412}.tag.lv-boss{background:#fef3c7;color:#854d0e}
[hidden]{display:none!important}

.comic{margin:0}.comic img{width:100%;height:auto;border-radius:var(--r);display:block;border:3px solid #1d2340}.comic figcaption{font-size:.85em;color:#666;margin-top:4px}
.scan{margin:10px 0}.scan img{width:100%;border-radius:12px;margin-top:8px}
.umap{width:100%;height:auto;border-radius:var(--r);border:3px solid #1d2340;display:block;margin:8px 0 14px}
.mroom .rbg{fill:#3e2714;stroke:#fde68a;stroke-width:3;transition:fill .2s}.mroom:hover .rbg,.mroom:focus .rbg{fill:#5a3a1c;stroke:#fff}.mroom.dn .rbg{stroke:#4ade80}
.mroom .rl{fill:#fff;font-size:15px;font-weight:800}
.chapbadge{background:#fef3c7;border-radius:12px;padding:10px;font-size:1.1em}
/* ---------- hint guide ---------- */
.hintbtn{background:linear-gradient(135deg,#f59e0b,#ea580c);box-shadow:0 4px 0 #b45309}
.hsheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(29,35,64,.55);display:flex;align-items:flex-end;justify-content:center;padding:10px}
@media(min-width:700px){.hsheet-wrap{align-items:center}}
.hsheet{background:var(--card);color:var(--ink);width:100%;max-width:620px;max-height:calc(100vh - 20px);overflow:auto;border-radius:28px;padding:16px 16px 12px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:6px solid var(--brand)}
.hsheet.hk-math{border-top-color:#2563eb}.hsheet.hk-sci{border-top-color:#16a34a}.hsheet.hk-eng{border-top-color:#db2777}.hsheet.hk-zh{border-top-color:#dc2626}
.hhead{display:flex;align-items:center;gap:10px}.hhead b{flex:1}
.hdots{display:flex;gap:5px}.hdots i{width:10px;height:10px;border-radius:50%;background:#d7d2ff}.hdots i.on{background:var(--brand);transform:scale(1.3)}.hdots i.done{background:#f5b800}
.hx{min-width:48px;min-height:48px;border:0;border-radius:14px;background:#f3f1ff;font-size:20px;font-weight:800}
.hsheet h3{margin:8px 0 6px;font-size:22px}
.hart{background:#fff;border:2px solid #ece8ff;border-radius:18px;padding:8px;display:grid;place-items:center}
.hsvg,.hart .bm{width:100%;height:auto;max-height:280px}
.homega{width:140px}.homega .rsvg{width:100%;color:var(--ink)}
.htxt{font-size:19px;margin:10px 2px}
.hlist{margin:0 0 6px;padding-left:24px}.hlist li{margin:4px 0}
.hz{font-size:28px;margin:8px 0 0;text-align:center}.hpy{font-size:22px;font-weight:800;text-align:center;margin:4px 0}
.tone.t1{color:#e11d48}.tone.t2{color:#ea580c}.tone.t3{color:#16a34a}.tone.t4{color:#2563eb}.tone.t0{color:#64748b}
.hnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.hnav .btn{flex:1;min-height:52px;padding:0 12px}.hnav .btn[disabled]{opacity:.45}
.hnote{margin:8px 0 0;text-align:center;color:var(--muted);font-size:15px}
/* ---------- topbar extras ---------- */
.logohome{display:inline-flex;flex-direction:column;align-items:center;line-height:1;flex:none}
.logohome img{width:36px;height:36px}
.homelbl{display:inline-flex;align-items:center;gap:2px;margin-top:1px;font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.02em}
.brand:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.trophy{min-width:48px;min-height:48px;display:grid;place-items:center;border-radius:14px;background:#fff;box-shadow:0 2px 0 #e6d6b8;text-decoration:none;font-size:24px}
.timeleft{font-weight:800;font-size:15px;color:var(--muted);background:#fff;border-radius:999px;padding:6px 10px;white-space:nowrap}
.timeleft.low{background:#fff1f2;color:#b42318}
@media(max-width:430px){.brand .bname{display:none}.topbar{gap:6px;padding:8px 10px}.back span{display:none}}
.ttoast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;background:#1d2340;color:#fff;font-weight:700;border-radius:18px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw}
.timesup{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#6d5df5,#4338ca)}
body.locked{overflow:hidden}
.tucard{background:var(--card);color:var(--ink);border-radius:32px;padding:22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.tuomega{width:170px;height:auto}.tuarm{transform-origin:80px 66px;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@media(prefers-reduced-motion:reduce){.tuarm{animation:none}}
.tusaved{color:var(--ok);font-weight:800}
.tugate summary{min-height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-weight:700}
/* ---------- awards ---------- */

.wbody{display:flex;flex-direction:column;gap:4px;min-width:0}.wbody small{color:var(--muted);overflow-wrap:anywhere}
.wchip{display:inline-block;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--ink);border-radius:99px;padding:1px 8px;font-weight:700}
.wbig{font-size:40px}.wlink{min-height:48px;align-self:flex-start;font-size:15px}
.wempty{display:flex;gap:12px;align-items:center;background:#fff;border:3px dashed #c4b5fd;border-radius:18px;padding:12px 16px;margin:10px 0}
.wtime{list-style:none;padding:0 0 0 18px;margin:0;border-left:5px dotted #c4b5fd}
.wtime li{margin-bottom:14px}.wday{position:relative;font-size:1.1rem}
.wdot{position:absolute;left:-32px;top:4px;width:20px;height:20px;border-radius:50%;background:#7c3aed;border:4px solid #fff}
.wbackup summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:800}
.wview .wvc{max-width:min(720px,94vw);width:100%;max-height:92vh;overflow:auto}
.wstage{background:#fff;border-radius:14px;display:flex;justify-content:center;align-items:center;min-height:200px}
.wstage img{max-width:100%;max-height:56vh;object-fit:contain}
.wstrip .panel{min-height:150px}
.hx{min-width:48px;min-height:48px}
@media (prefers-reduced-motion:reduce){.wbook,.wcard{animation:none!important}}
@media (orientation:landscape) and (max-height:500px){.wstage img{max-height:44vh}}
.overlay.wview{z-index:4;padding-top:72px}
/* ---------- robot helpers ---------- */
.rbt .flame{transform-box:fill-box;transform-origin:center top;animation:rflame .25s ease-in-out infinite alternate}
@keyframes rflame{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
.rbt .ant,.drone .prop{transform-origin:70px 30px;animation:rwig 1.6s ease-in-out infinite}
.drone .prop{transform-origin:30px 10px;animation:rspin .5s linear infinite}
.drone .prop path{transform-box:fill-box;transform-origin:center}
@keyframes rspin{from{transform:scaleX(1)}50%{transform:scaleX(.2)}to{transform:scaleX(1)}}
@keyframes rwig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.rbt .sunem{transform-box:view-box;transform-origin:70px 90px;animation:rspin2 8s linear infinite}@keyframes rspin2{to{transform:rotate(360deg)}}
.rbt .blink{animation:rblink 1.2s steps(2) infinite}.rbt .b2{animation-delay:.6s}@keyframes rblink{50%{opacity:.3}}
.rbt.talk{animation:rtalk .5s ease-in-out 3}@keyframes rtalk{50%{transform:translateY(-6px) rotate(-3deg)}}
.rcard{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.rbig{flex:0 0 150px}.rbig svg{width:150px;height:auto}
.shadow svg{filter:brightness(0) opacity(.25)}
.drones{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dronebtn{min-width:72px;min-height:72px;border:3px solid #fde68a;border-radius:16px;background:#fffbeb;display:flex;flex-direction:column;align-items:center;cursor:pointer;font:inherit;padding:4px}
.dronebtn.done{border-color:#16a34a;background:#dcfce7}.drone.on{animation:rhover 1.8s ease-in-out infinite}@keyframes rhover{50%{transform:translateY(-5px)}}
.boing{animation:boing .5s}
.rcoach{display:flex;gap:10px;align-items:center;background:#fff7ed;border:3px solid #fb923c;border-radius:16px;padding:8px 12px;margin:8px 0}.rcoach p{margin:0}.rcbot{flex:0 0 72px}
.rblast{margin:10px auto;text-align:center}.rblast .launch svg,.rbig.launch svg{animation:rlaunch 1.8s cubic-bezier(.5,0,.6,1) both}
@keyframes rlaunch{0%{transform:translateY(0)}15%{transform:translateY(4px)}70%{transform:translateY(-120px) scale(.9)}100%{transform:translateY(0)}}
.rblast svg{width:110px;height:auto}.rlock{display:flex;gap:10px;align-items:center;justify-content:center}
.rmini{display:flex;gap:2px}.rmini svg{width:34px;height:42px}
@media (prefers-reduced-motion:reduce){.rbt *,.rbt,.drone,.drone *,.rblast svg,.rbig svg{animation:none!important}}
</style>

<script>window.CONTENT={"level":{"id":"p3","name":"P3","title":"Primary 3","year":2027},"label":"Original practice questions modelled on the MOE syllabus","subjects":[{"id":"science","name":"Science","zh":"科学","icon":"🔬","color":"#1f9d61","sectionLabel":"Theme","blurb":"Diversity, Cycles, Interactions","terms":[{"id":"diversity","name":"Diversity","when":"Terms 1–2","blurb":"Living things and materials.","topics":[{"id":"living-non-living","title":"Living and non-living things","when":"Term 1","lesson":["Living things need water, food and air.","Living things grow, respond and reproduce.","Moving alone does not make something living.","Groups of living things: plants, animals, fungi and bacteria.","Plants can be flowering or non-flowering. Fungi include mould, mushrooms and yeast."],"experiments":[{"title":"Yeast balloon: is yeast alive?","need":["1 sachet of dry yeast","2 teaspoons of sugar","½ cup of warm (not hot) tap water","A bottle","A balloon"],"steps":["An adult pours the warm water into the bottle.","Add the yeast and sugar.","Stretch the balloon over the mouth of the bottle.","Wait 20–30 minutes and watch."],"happened":"The balloon blew up by itself.","why":"Yeast is a fungus. It is alive. It feeds on the sugar and gives off gas, which fills the balloon.","safety":"An adult handles the warm water. Do not drink the mixture."},{"title":"Bread mould watch","need":["A slice of bread","A zip bag","A few drops of water","Notebook and pencil"],"steps":["Put the bread and a few drops of water in the bag.","Seal the bag.","Look at it every day for 7 days.","Draw what you see each day."],"happened":"Fuzzy spots of mould grew and spread on the bread.","why":"Mould is a fungus. It is a living thing, so it grows.","safety":"Never open the bag. Throw it away sealed. Mould spores can cause allergies."}],"questions":[{"type":"mcq","prompt":"A toy robot moves and makes sounds. Is it living?","options":["Yes, because it moves","No"],"answer":1,"hint":"Moving is not enough. Does it need food? Can it grow?","steps":["It does not need food, water and air.","It cannot grow.","It cannot reproduce.","So it is non-living."],"explain":"Moving alone does not make something living."},{"type":"mcq","prompt":"Mushrooms are not plants. Which group are they in?","options":["Animals","Fungi","Bacteria","Non-living things"],"answer":1,"hint":"Mould and yeast are in the same group.","steps":["Green plants make their own food from sunlight.","Mushrooms cannot do this.","They feed on dead or decaying matter.","So they are fungi."],"explain":"Mushrooms are fungi. They feed on dead or decaying matter."},{"type":"mcq","prompt":"Sort these plants: fern, hibiscus, moss, rose. Which two are FLOWERING?","options":["Fern and moss","Hibiscus and rose","Fern and rose","Moss and hibiscus"],"answer":1,"hint":"Which ones do you see with flowers?","steps":["Hibiscus and rose produce flowers.","Fern and moss do not.","So flowering = hibiscus, rose."],"explain":"Sort plants by whether they produce flowers."},{"type":"mcq","prompt":"Which of these is NOT something all living things do?","options":["Grow","Reproduce","Respond","Talk"],"answer":3,"extra":true,"hint":"Living things grow, respond and reproduce.","steps":["Grow, respond and reproduce are signs of life.","Plants and fungi do not talk.","So the answer is talk."],"explain":"Talking is not a characteristic of all living things."},{"type":"text","prompt":"In the yeast balloon test, the balloon blew up. Yeast is a living thing. Which group is yeast in?","answer":["fungi","fungus","a fungus"],"extra":true,"hint":"Same group as mushrooms. Starts with f.","steps":["Yeast fed on sugar and gave off gas.","That shows it is alive.","Yeast belongs to the fungi group."],"explain":"Yeast is a fungus, like mould and mushrooms."}]}]},{"id":"cycles","name":"Cycles","when":"Terms 2–3","blurb":"Life cycles of plants and animals.","topics":[{"id":"life-cycles","title":"Life cycles","when":"Terms 2–3","lesson":["Different living things have different life cycles.","A flowering plant: seed → young plant → adult plant.","Butterfly (4 stages): egg → larva → pupa → adult.","Grasshopper (3 stages): egg → nymph → adult. A nymph looks like a small adult with no wings.","Frog: egg → tadpole → young frog → adult frog."],"experiments":[{"title":"Bean in a jar","need":["A green bean","A clear jar","Paper towel","Water"],"steps":["Wet the paper towel and line the jar with it.","Wedge the bean between the towel and the side of the jar.","Keep the towel damp.","Take a photo every 2 days for 3 weeks."],"happened":"A root and a shoot came out. The bean grew into a young plant.","why":"This is the plant life cycle: seed → young plant → adult plant."},{"title":"Life-cycle wheel","need":["2 paper plates","Coloured pencils","A split pin","Scissors (ask an adult)"],"steps":["Draw the 4 butterfly stages around one plate.","On the back, draw the 3 cockroach stages.","Cut a window in the second plate and pin it on top.","Spin it to see each stage in order."],"happened":"Each turn shows the next stage. After the adult, it goes back to the egg.","why":"A life cycle repeats. Butterflies have 4 stages; cockroaches have 3.","safety":"Optional: watch caterpillars on a lime plant with an adult. Look, don't touch."}],"questions":[{"type":"mcq","prompt":"Which one has a pupa stage?","options":["Butterfly","Grasshopper"],"answer":0,"hint":"Which one has 4 stages?","steps":["Butterfly: egg → larva → pupa → adult.","Grasshopper: egg → nymph → adult.","Only the butterfly has a pupa."],"explain":"The grasshopper's young is a nymph, which looks like a small adult with no wings."},{"type":"mcq","prompt":"Why must we not leave stagnant water in flowerpot plates?","options":["It makes the plant too wet","Mosquitoes lay eggs in still water","Water is expensive","Fish will grow there"],"answer":1,"hint":"Think of dengue.","steps":["Mosquitoes lay eggs in still water.","Their larvae live in the water.","Removing the water breaks the life cycle.","This helps prevent dengue."],"explain":"No still water means mosquitoes cannot complete their life cycle."},{"type":"text","prompt":"A frog's young lives in water and breathes with gills. What is the young called?","answer":["tadpole","a tadpole","tadpoles"],"hint":"It starts with t.","steps":["Frog eggs hatch into young that live in water.","They breathe with gills and have tails.","They are called tadpoles."],"explain":"The young of a frog is a tadpole."},{"type":"number","prompt":"How many stages are in a butterfly's life cycle?","answer":[4],"extra":true,"hint":"Count: egg, larva, pupa, adult.","steps":["Egg (1), larva (2), pupa (3), adult (4).","So there are 4 stages."],"explain":"Egg, larva, pupa, adult."},{"type":"mcq","prompt":"What is the correct order for a flowering plant?","options":["Adult plant → seed → young plant","Seed → young plant → adult plant","Young plant → seed → adult plant"],"answer":1,"extra":true,"hint":"What did you plant in the bean jar?","steps":["It starts as a seed.","The seed grows into a young plant.","The young plant becomes an adult plant."],"explain":"Seed → young plant → adult plant."}]}]},{"id":"interactions","name":"Interactions","when":"Terms 3–4","blurb":"Forces: magnets.","topics":[{"id":"magnets","title":"Magnets","when":"Terms 3–4","lesson":["A magnet can push or pull.","Magnets are made of iron or steel. They attract magnetic materials.","Every magnet has two poles: N and S.","Unlike poles attract. Like poles repel.","A freely hanging bar magnet points North–South. That is how a compass works.","You can make a magnet by the stroke method or the electrical method."],"experiments":[{"title":"Magnet treasure hunt","need":["A magnet","Paper clips","Coins","A pencil","An aluminium can","Keys","A plastic spoon"],"steps":["Guess which objects the magnet will pick up.","Test each object.","Sort them: attracted or not attracted.","Check your guesses."],"happened":"Paper clips stuck to the magnet. The pencil, plastic spoon and aluminium can did not.","why":"Magnets attract magnetic materials like iron and steel. Not all metals are magnetic: aluminium is not."},{"title":"Make a magnet and a floating compass","need":["A steel sewing needle","A magnet","Pins","A small piece of cork","A bowl of water"],"steps":["Stroke the needle 30 times in ONE direction with one pole of the magnet.","Test it: does it pick up pins?","Push it through the cork.","Float it in the bowl and watch."],"happened":"The needle picked up pins. Floating on the cork, it turned to point North–South.","why":"Stroking made the needle a magnet (the stroke method). A free magnet points North–South.","safety":"An adult handles the needle. The electrical method (wire round a nail and 1 AA battery) is for an adult to show, only for a few seconds, because the wire gets hot."}],"questions":[{"type":"mcq","prompt":"Two magnets push each other away. What can you say about the facing poles?","options":["They are unlike poles (N–S)","They are like poles (N–N or S–S)","One magnet is broken"],"answer":1,"hint":"Pushing away = repelling.","steps":["The magnets repel.","Like poles repel.","So the facing poles are like poles."],"explain":"Like poles repel."},{"type":"mcq","prompt":"Why is a fridge door seal magnetic?","options":["To make the fridge colder","The magnet pulls the door shut tightly, so cold air stays in","To stick photos on it"],"answer":1,"hint":"What would happen if the door did not close tightly?","steps":["The magnet attracts the steel fridge body.","This pulls the door shut tightly.","Cold air stays inside."],"explain":"The magnet keeps the door sealed."},{"type":"mcq","prompt":"A magnet picks up 6 clips. After 30 strokes, a needle picks up 2 clips. What is the needle now?","options":["A non-magnetic needle","A weaker magnet made by the stroke method","A stronger magnet than the first one"],"answer":1,"hint":"It picks up clips, but fewer.","steps":["The needle can now pick up clips, so it is a magnet.","2 clips is fewer than 6.","So it is a weaker magnet, made by the stroke method."],"explain":"Stroking made the needle a (weaker) magnet."},{"type":"mcq","prompt":"Isaac's magnet does not pick up a drink can. The can is most likely made of ___.","options":["iron","steel","aluminium"],"answer":2,"extra":true,"hint":"Which metal is NOT magnetic?","steps":["Iron and steel are magnetic.","Aluminium is not magnetic.","So the can is aluminium."],"explain":"Not all metals are magnetic."},{"type":"number","prompt":"How many poles does every magnet have?","answer":[2],"extra":true,"hint":"N and ...?","steps":["A magnet has a north pole (N).","It has a south pole (S).","So it has 2 poles."],"explain":"Every magnet has two poles."}]}]},{"id":"bonus","name":"Bonus: enrichment","bonus":true,"blurb":"Fun extras beyond the P3 syllabus. Not in exams.","cards":[{"title":"Space","icon":"🪐","text":"Make a Sun–Earth–Moon model with a torch. Keep a Moon-phase diary for one month. Why do we have day and night?"},{"title":"Human body","icon":"🫀","text":"Body detective: find your pulse. Count breaths per minute before and after 20 star-jumps. (Preview of P4/P5 Systems.)"},{"title":"Nature trail","icon":"🌿","text":"Visit the Botanic Gardens, Sungei Buloh or MacRitchie. Spot and sort 10 living things. Look for mudskippers: fish that live partly out of water!"},{"title":"Simple machines","icon":"⚙️","text":"Make a see-saw with a ruler and an eraser. Why can a small child lift a bigger one? A small force far from the pivot balances a bigger force near the pivot."}],"topics":[]},{"id":"challenge","name":"🔥 Challenge & 👑 Boss","blurb":"Harder questions with worked solutions.","challenge":true,"topics":[{"id":"challenge-diversity","title":"🔥 Diversity challenge","challenge":true,"badge":"Diversity challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"challenge","src":"S2","prompt":"Why is a mushroom NOT a plant? Pick the answer with two correct reasons.","options":["It is small and grows on logs","It cannot make its own food, and it reproduces by spores while getting food from dead or decaying things","It has no flowers and it is brown","It needs water and air"],"answer":1,"hint":"Think: can a mushroom make its own food?","steps":["It cannot make its own food (no green part, no chlorophyll).","It reproduces by spores and gets food from dead or decaying things.","Plants make their own food, so a mushroom is not a plant."],"explain":"Plants make their own food. Fungi do not."},{"type":"mcq","level":"challenge","src":"S4","prompt":"Isaac tests wood, steel, plastic foam and clay blocks (all the same size) to find the best swimming-pool float. What should he CHANGE in this fair test?","options":["The size of the blocks","The water","The material of the block","How he places each block"],"answer":2,"hint":"Only one thing changes in a fair test.","steps":["Keep the same: size/shape of block, the water, how he places it.","Change: the material.","Observe: does it float, and how high it sits.","Foam floats highest → best float."],"explain":"Change one thing, keep the rest the same."},{"type":"mcq","level":"challenge","src":"S6","prompt":"Isaac pours 100 ml of water on towels A, B and C, waits 1 min, then squeezes out: A 60 ml, B 20 ml, C 45 ml. Which towel absorbed the MOST water?","options":["A","B","C"],"answer":1,"hint":"Absorbed = 100 − squeezed out.","steps":["Absorbed = 100 − squeezed out.","A: 40 ml, B: 80 ml, C: 55 ml.","B absorbs the most.","Trick: the SMALLEST squeezed-out number means the MOST absorbed!"],"explain":"B kept 80 ml."},{"type":"mcq","level":"boss","src":"S1","prompt":"A mushroom, a fern and a moss grow on a damp log. Robo-Rex the robot says \"All three make seeds.\" Is Robo-Rex correct?","options":["Yes, all three make seeds","No, none make seeds; all three make spores","Only the fern makes seeds","Only the mushroom makes seeds"],"answer":1,"hint":"How do fungi, ferns and mosses reproduce?","steps":["A mushroom is a fungus. It reproduces by spores.","Ferns and mosses are plants that also reproduce by spores, not seeds.","So Robo-Rex is wrong: none of them make seeds; all make spores."],"explain":"Ferns, mosses and fungi all use spores."},{"type":"mcq","level":"boss","src":"S3","prompt":"Classification key for shark, dolphin, frog, eagle. Q1 \"Has feathers?\" Q2 \"Breathes with gills all its life?\" Q3 \"Has hair/fur at some stage?\" Which animal is LEFT OVER at the end?","options":["Shark","Dolphin","Frog","Eagle"],"answer":2,"hint":"A tadpole has gills, but does the adult frog?","steps":["Feathers → eagle.","Gills all its life → shark.","Hair (dolphins have a few hairs at birth) → dolphin.","Left over → frog (gills only when it is a tadpole).","Trick: a dolphin is a mammal, not a fish!"],"explain":"Dolphin = mammal, frog = gills only as a tadpole."},{"type":"mcq","level":"boss","src":"S5","prompt":"A wushu staff must be strong, not too heavy, and bend a little without breaking. Which material is BEST: steel, rattan, glass or clay?","options":["Steel","Rattan","Glass","Clay"],"answer":1,"hint":"Cross out the ones that break first.","steps":["Glass and clay are brittle (they break) → out.","Steel is strong but heavy and does not bend much.","Rattan is light, strong and flexible → best.","That is why real wushu staffs are often rattan or wax wood."],"explain":"Rattan is light, strong and flexible."}]},{"id":"challenge-cycles","title":"🔥 Cycles challenge","challenge":true,"badge":"Cycles challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"challenge","src":"S8","prompt":"A frog lays about 2000 eggs but a dog has about 6 puppies. Why does the frog lay so many?","options":["Frogs are bigger than dogs","Frog eggs and tadpoles are not protected by the parent, so many are eaten or die","Frogs live longer","Water makes eggs grow faster"],"answer":1,"hint":"Who looks after the young?","steps":["Frog eggs and tadpoles are not protected by the parent.","Many are eaten or die.","Laying many means some survive to become adults.","Puppies are cared for by the mother, so most survive."],"explain":"More eggs = some survive without care."},{"type":"number","level":"challenge","src":"S10","prompt":"A plant's height: Week 1 2 cm, Week 2 5 cm, Week 3 9 cm, Week 4 10 cm. It grew the most between Week 2 and Week ___? (type the week number)","answer":[3],"hint":"Growth = the difference between two weeks.","steps":["Growth = difference.","W1→W2: 3 cm. W2→W3: 4 cm. W3→W4: 1 cm.","Most growth: between Week 2 and Week 3."],"explain":"4 cm between Week 2 and Week 3."},{"type":"mcq","level":"boss","src":"S7","prompt":"A butterfly and a cockroach. Which one has a PUPA stage, and what does a young cockroach look like?","options":["Butterfly; a young cockroach (nymph) looks like a small adult without wings","Cockroach; a young butterfly looks like the adult","Both have a pupa stage","Neither has a pupa stage"],"answer":0,"hint":"Count the stages for each insect.","steps":["Butterfly: egg → larva → pupa → adult (4 stages).","Cockroach: egg → nymph → adult (3 stages, no pupa).","A nymph looks like a small adult without wings."],"explain":"Only the butterfly has a pupa."},{"type":"mcq","level":"boss","src":"S9","prompt":"Seeds in: A wet cotton, warm; B dry cotton, warm; C wet cotton, in a fridge. Only A germinates. What two things do seeds need, from THIS experiment?","options":["Water and light","Water and warmth","Light and soil","Warmth and air"],"answer":1,"hint":"Compare two setups where only one thing is different.","steps":["Compare A and B: only water differs → seeds need water.","Compare A and C: only temperature differs → seeds need warmth.","Light was not tested!"],"explain":"Water and warmth (light was not tested)."}]},{"id":"challenge-interactions","title":"🔥 Interactions challenge","challenge":true,"badge":"Interactions challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"challenge","src":"S13","prompt":"Two ring magnets on a pencil: the top one floats above the bottom one. Why?","options":["Like poles face each other, so they repel","Unlike poles face each other, so they attract","The pencil is magnetic","Air pushes it up"],"answer":0,"hint":"Same poles…?","steps":["Facing poles are the same (N–N or S–S) → they repel and push the top one up.","Flip the top one → unlike poles face → they attract and snap together."],"explain":"Like poles repel."},{"type":"mcq","level":"challenge","src":"S15","prompt":"Does a rubber goggles strap stretch more in hot or cold water? Which plan is a FAIR test?","options":["Use two identical straps of the same length; soak one in hot and one in cold water for the same time; hang the same weight on each and measure the new length","Use one long and one short strap in hot water","Soak one strap in hot water for 1 min and the other in cold water for 10 min","Pull each strap by hand and guess"],"answer":0,"hint":"Only the water temperature should change.","steps":["Use two identical straps, same length.","Soak one in hot water and one in cold water for the same time.","Hang the same weight on each and measure the new length with a ruler. Compare."],"explain":"Change only the temperature."},{"type":"mcq","level":"boss","src":"S11","prompt":"A robot-arm magnet picks up a steel paper clip but not an aluminium can or a copper coin. Isaac says \"Magnets attract all metals.\" Why is he wrong?","options":["Aluminium and copper are metals but were not attracted, so magnets attract only magnetic materials","The magnet was too weak","The can was too heavy","Steel is not a metal"],"answer":0,"hint":"Were the can and coin metal?","steps":["Aluminium and copper are metals but were not picked up.","So magnets attract only magnetic materials (iron, steel, nickel, cobalt), not all metals."],"explain":"Only magnetic materials are attracted."},{"type":"mcq","level":"boss","src":"S12","prompt":"Magnets X, Y, Z hold chains of paper clips: X 4, Y 9, Z 6. Which is strongest, and what must be kept the same?","options":["X; the colour of the magnets","Y; the same size and type of paper clips","Z; the same magnet","Y; nothing needs to stay the same"],"answer":1,"hint":"More clips = stronger.","steps":["a) Y holds the most clips, so Y is strongest.","b) Keep the same size/type of paper clips (or the same way of hanging).","Otherwise the test is not fair."],"explain":"Y, with the same kind of clips."},{"type":"mcq","level":"boss","src":"S14","prompt":"How can Isaac turn a steel needle into a magnet?","options":["Stroke it with one pole of a magnet, many times, in one direction only","Rub it back and forth in both directions","Put it in water","Heat it in a flame"],"answer":0,"hint":"It is called the stroke method.","steps":["Stroke the needle with one pole of a magnet, many times, in ONE direction only (stroke method).","Check: bring it near paper clips. If it attracts them, it is a magnet."],"explain":"Stroke method, one direction."}]}]}]},{"id":"english","name":"English","zh":"英文","icon":"📖","color":"#c2410c","sectionLabel":"Term","blurb":"Stretch reading + comic maker","tools":[{"id":"comic","title":"Make your own comic strip","icon":"💬"}],"terms":[{"id":"t1","name":"Term 1","blurb":"Secret lives of living things","topics":[{"id":"night-garden","title":"Reading: The Night Garden","stretch":true,"lesson":["Read the story carefully.","Look for clue words.","Focus: past continuous (was + -ing) and describing words."],"passage":["When the last bus had grumbled past, Isaac crept to the balcony with his torch. The bougainvillea, which looked so ordinary by day, was alive with tiny visitors. A gecko waited motionless on the wall, its eyes gleaming like two drops of honey. Suddenly it lunged, and a moth vanished. \"Living things are always hunting for food,\" Isaac whispered, scribbling in his notebook. Below, a snail glided across the wet tiles, leaving a silver ribbon behind it."],"vocab":["grumbled","motionless","gleaming","lunged","vanished","glided"],"comicPrompt":"The Gecko Who Wanted to Be a Bird. Use at least 3 speech bubbles and one sound word.","questions":[{"type":"mcq","prompt":"Which phrase shows the gecko was very still?","options":["\"waited motionless\"","\"suddenly it lunged\"","\"eyes gleaming\"","\"a moth vanished\""],"answer":0,"hint":"Find a word that means 'not moving'.","steps":["'Motionless' means not moving at all.","So 'waited motionless' shows it was very still."],"explain":"Motionless = not moving at all."},{"type":"mcq","prompt":"What does \"a silver ribbon\" refer to?","options":["A real ribbon on the floor","The snail's shiny slime trail","Moonlight on the wall","Isaac's torch beam"],"answer":1,"hint":"What did the snail leave behind it?","steps":["The snail glided across the tiles.","It left a shiny trail.","The trail looks like a ribbon. This is a metaphor."],"explain":"The writer compares the slime trail to a ribbon."},{"type":"mcq","prompt":"Rewrite in the past continuous: \"A snail glided across the tiles.\"","options":["A snail glides across the tiles.","A snail was gliding across the tiles.","A snail is gliding across the tiles.","A snail will glide across the tiles."],"answer":1,"hint":"Past continuous = was/were + -ing.","steps":["Past continuous uses was/were + verb-ing.","A snail is one thing, so use 'was'.","glide → gliding.","A snail was gliding across the tiles."],"explain":"was + gliding."},{"type":"mcq","prompt":"What happened to the moth?","options":["It flew away","The gecko ate it","Isaac caught it","It hid in the bougainvillea"],"answer":1,"extra":true,"hint":"The gecko lunged. Then the moth ___.","steps":["The gecko lunged at it.","The moth vanished.","Isaac says living things hunt for food.","So the gecko ate it."],"explain":"Inference: the gecko caught and ate the moth."},{"type":"mcq","prompt":"What does \"lunged\" mean?","options":["Moved forward suddenly","Fell asleep","Breathed slowly","Sang loudly"],"answer":0,"extra":true,"hint":"The word 'Suddenly' comes just before it.","steps":["'Suddenly' tells us it was quick.","Then the moth vanished: the gecko attacked.","Lunged = moved forward suddenly."],"explain":"Lunge = a sudden forward move."}]}]},{"id":"t2","name":"Term 2","blurb":"Materials & inventors","topics":[{"id":"raincoat-race","title":"Reading: The Raincoat Race","stretch":true,"lesson":["Read the story.","Use clue words to explain WHY.","Focus: although, and -est words (superlatives)."],"passage":["Mei claimed her paper-towel raincoat was the cleverest invention in Class 3B. Within thirty seconds of the sprinkler test, it had become a soggy, drooping rag. Jun's plastic-bag coat crackled loudly, but he stayed perfectly dry. \"Absorbent materials are useless here,\" their teacher laughed, \"although they are excellent for mopping up the mess!\""],"vocab":["claimed","soggy","drooping","crackled","absorbent","excellent"],"comicPrompt":"Invention Day Disaster. Use the wrong material, show what goes wrong and how it is fixed.","questions":[{"type":"mcq","prompt":"Why did Mei's raincoat fail?","options":["It was too noisy","Paper towel absorbs water, so it became soggy","It was too small","Jun tore it"],"answer":1,"hint":"Look for the words 'absorbent' and 'soggy'.","steps":["Paper towel is absorbent.","It soaked up the water.","It became a soggy rag."],"explain":"Clue words: 'absorbent' and 'soggy rag'."},{"type":"mcq","prompt":"Combine with \"although\": Jun's coat was noisy. It kept him dry.","options":["Although Jun's coat was noisy, it kept him dry.","Although Jun's coat kept him dry, it kept him dry.","Jun's coat was noisy although.","Although noisy Jun, coat dry."],"answer":0,"hint":"Although + first idea, then a comma, then the second idea.","steps":["Start with 'Although'.","Add the first idea: Jun's coat was noisy.","Add a comma.","Finish: it kept him dry."],"explain":"Although Jun's coat was noisy, it kept him dry."},{"type":"text","prompt":"What is the superlative form of \"clever\"?","answer":["cleverest","the cleverest","most clever","the most clever"],"hint":"It is in the first sentence of the story.","steps":["Superlative = the most.","clever + est = cleverest."],"explain":"cleverest"},{"type":"mcq","prompt":"Which word tells us Jun's coat made a noise?","options":["drooping","crackled","claimed","soggy"],"answer":1,"extra":true,"hint":"It is a sound word.","steps":["'Crackled' is the sound plastic makes.","So crackled tells us it was noisy."],"explain":"Crackled is a sound word."},{"type":"mcq","prompt":"Why does the teacher say absorbent materials are 'excellent for mopping up'?","options":["They soak up water","They are waterproof","They are shiny","They are heavy"],"answer":0,"extra":true,"hint":"What does absorbent mean?","steps":["Absorbent means it soaks up water.","Mopping means soaking up spills.","So they are good for mopping."],"explain":"Absorbent = soaks up water. (Links to Science materials.)"}]}]},{"id":"t3","name":"Term 3","blurb":"Metamorphosis","topics":[]},{"id":"t4","name":"Term 4","blurb":"Magnet mysteries","topics":[]},{"id":"challenge","name":"🔥 Challenge & 👑 Boss","blurb":"Harder questions with worked solutions.","challenge":true,"topics":[{"id":"challenge-grammar","title":"🔥 Grammar & synthesis challenge","challenge":true,"badge":"Grammar & synthesis challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"challenge","src":"E2","prompt":"Join: \"The water was very cold. We could not swim in it.\"","options":["The water was too cold for us to swim in.","The water was too cold for us not to swim in.","The water was very cold to swim in.","The water was so cold for us to swim."],"answer":0,"hint":"\"too … to\" already means \"not able\".","steps":["\"very\" becomes \"too\".","\"could not\" disappears because \"too…to\" already means \"not able\".","The water was too cold for us to swim in."],"explain":"too … to = not able."},{"type":"mcq","level":"challenge","src":"E4","prompt":"Join with \"Although\": \"The robot was small. It could lift heavy boxes.\"","options":["Although the robot was small, but it could lift heavy boxes.","Although the robot was small, it could lift heavy boxes.","Although the robot could lift heavy boxes, it was small but.","The robot was small although, it could lift heavy boxes."],"answer":1,"hint":"Do we need \"but\" after \"although\"?","steps":["\"Although\" goes before the first idea.","Add a comma, then the second idea.","No \"but\" after \"although\"!"],"explain":"Never use \"although\" and \"but\" together."},{"type":"mcq","level":"challenge","src":"E6","prompt":"Which sentence fixes ALL 3 mistakes? \"Yesterday Isaac swim four lap and then he eated lunch.\"","options":["Yesterday Isaac swam four laps and then he ate lunch.","Yesterday Isaac swims four laps and then he eats lunch.","Yesterday Isaac swam four lap and then he ate lunch.","Yesterday Isaac swim four laps and then he eated lunch."],"answer":0,"hint":"\"Yesterday\" = past tense. Four = more than one.","steps":["swim → swam (past tense).","lap → laps (four = plural).","eated → ate (irregular past tense).","Tip: \"Yesterday\" = past tense."],"explain":"swam, laps, ate."},{"type":"mcq","level":"challenge","src":"E8","prompt":"The tired swimmer felt ______ after 40 laps.","options":["exhausted","excited"],"answer":0,"hint":"Look for clue words in the sentence.","steps":["Clue words: \"tired\" and \"40 laps\".","Exhausted = very, very tired."],"explain":"Exhausted = very tired."},{"type":"mcq","level":"boss","src":"E1","prompt":"Join with \"who\": \"Isaac is my friend. He won a wushu medal.\"","options":["Isaac, who won a wushu medal, is my friend.","Isaac who is my friend, he won a wushu medal.","Isaac is my friend who he won a wushu medal.","Isaac, which won a wushu medal, is my friend."],"answer":0,"hint":"Who is \"He\"?","steps":["Find the shared person: Isaac = He.","Replace \"He\" with \"who\".","Slot it right after \"Isaac\", with commas."],"explain":"Isaac, who won a wushu medal, is my friend."},{"type":"mcq","level":"boss","src":"E3","prompt":"Rewrite with \"Unless\": \"If you do not practise, you will not improve.\"","options":["Unless you do not practise, you will not improve.","Unless you practise, you will not improve.","Unless you practise, you will improve.","You will improve unless you do not practise."],"answer":1,"hint":"\"Unless\" already means \"if not\".","steps":["\"Unless\" = \"if not\".","So remove the \"not\" from the first part.","Unless you practise, you will not improve."],"explain":"Unless = if not."},{"type":"mcq","level":"boss","src":"E5","prompt":"Reported speech: \"I am tired,\" said Isaac.","options":["Isaac said that I am tired.","Isaac said that he is tired.","Isaac said that he was tired.","Isaac said that I was tired."],"answer":2,"hint":"Change the person AND the tense.","steps":["I → he.","am → was (past, because \"said\").","Isaac said that he was tired."],"explain":"I → he, am → was."},{"type":"mcq","level":"boss","src":"E7","prompt":"Neither the coach nor the students ______ late.","options":["was","were"],"answer":1,"hint":"Look at the noun nearest the verb.","steps":["With \"neither…nor\", match the noun nearest the verb.","\"students\" is plural → were."],"explain":"Nearest noun: students (plural)."}]},{"id":"challenge-comprehension","title":"🔥 Comprehension challenge","challenge":true,"badge":"Comprehension challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"boss","src":"E9","prompt":"\"Mei stared at the diving board. Her knees shook. She took a deep breath, walked back to the ladder, then turned around again.\" How did Mei feel?","options":["Nervous, but trying to be brave","Bored","Angry at the coach","Sleepy"],"answer":0,"hint":"What do shaking knees tell you?","steps":["Clue 1: her knees shook → scared or nervous.","Clue 2: she walked back, then turned around → she could not decide but wanted to be brave.","Inference = clues + what you know."],"explain":"Knees shook; she walked back then turned around."},{"type":"mcq","level":"boss","src":"E10","prompt":"\"The robot team practised every day for a month, but they still came second.\" True or false: \"The team did not practise enough.\"","options":["True, because they came second","False, because they practised every day for a month","True, because they were not good"],"answer":1,"hint":"Find proof in the passage.","steps":["The passage says they practised every day for a month.","Coming second does not mean they did not practise.","So the statement is false (or \"cannot tell\"). Always use proof from the passage."],"explain":"Use proof from the passage."}]}]}]},{"id":"math","name":"Math","zh":"数学","icon":"➗","color":"#2563eb","sectionLabel":"Term","blurb":"Numbers to 10 000 and bar models","terms":[{"id":"t1","name":"Term 1","blurb":"Numbers to 10 000; + and −; tables 6–9","topics":[{"id":"add-subtract-10000","title":"Addition and subtraction (bar models)","lesson":["Line up the digits: ones under ones, tens under tens.","Start from the ones. Regroup when you need to.","For a word problem, draw a bar model first.","The bar model shows what you know, and the ? you need to find.","Always check: add your answer back."],"questions":[{"type":"number","prompt":"4 006 − 1 278 = ?","answer":[2728],"hint":"You cannot take 8 from 6, and there are 0 tens and 0 hundreds. Regroup the thousands.","steps":["Regroup 4 thousands as 3 thousands, 9 hundreds, 9 tens and 16 ones.","Ones: 16 − 8 = 8.","Tens: 9 − 7 = 2.","Hundreds: 9 − 2 = 7.","Thousands: 3 − 1 = 2.","Answer: 2 728. Check: 2 728 + 1 278 = 4 006 ✓"]},{"type":"number","prompt":"A shop had 2 345 pens and sold 1 190. Then 860 more arrived. How many pens are there now?","answer":[2015],"hint":"Step 1: find how many were left after selling. Step 2: add the new pens.","barModel":{"bars":[{"label":"Start","parts":[{"value":1190,"label":"1 190 sold","tone":"a"},{"value":1155,"label":"left ?","tone":"unknown"}]}],"braces":[{"bar":0,"from":0,"to":2,"label":"2 345","pos":"top"}]},"steps":["Left after selling: 2 345 − 1 190 = 1 155.","Add the new pens: 1 155 + 860 = 2 015.","There are 2 015 pens now."]},{"type":"number","prompt":"3 457 + 2 386 = ?","answer":[5843],"extra":true,"hint":"Ones: 7 + 6 = 13. Write 3, carry 1.","steps":["Ones: 7 + 6 = 13. Write 3, carry 1.","Tens: 5 + 8 + 1 = 14. Write 4, carry 1.","Hundreds: 4 + 3 + 1 = 8.","Thousands: 3 + 2 = 5.","Answer: 5 843."]},{"type":"number","prompt":"Ali has 2 460 marbles. Ben has 1 350 more marbles than Ali. How many marbles do they have altogether?","answer":[6270],"extra":true,"hint":"First find how many Ben has. Then add both.","barModel":{"bars":[{"label":"Ali","parts":[{"value":2460,"label":"2 460","tone":"a"}]},{"label":"Ben","parts":[{"value":2460,"label":"","tone":"a"},{"value":1350,"label":"1 350 more","tone":"b"}]}],"brackets":[{"from":0,"to":1,"label":"?"}]},"steps":["Ben = 2 460 + 1 350 = 3 810.","Altogether = 2 460 + 3 810 = 6 270.","They have 6 270 marbles."]},{"type":"mcq","prompt":"Which is the best estimate of 4 982 + 3 015?","options":["7 000","8 000","9 000","80 000"],"answer":1,"extra":true,"hint":"Round each number to the nearest thousand.","steps":["4 982 rounds to 5 000.","3 015 rounds to 3 000.","5 000 + 3 000 = 8 000.","(Exact: 7 997, very close!)"]}]}]},{"id":"t2","name":"Term 2","blurb":"×/÷, money, measurement","topics":[]},{"id":"t3","name":"Term 3","blurb":"Fractions, time, bar graphs","topics":[]},{"id":"t4","name":"Term 4","blurb":"Angles, lines, area & perimeter","topics":[]},{"id":"challenge","name":"🔥 Challenge & 👑 Boss","blurb":"Harder questions with worked solutions.","challenge":true,"topics":[{"id":"challenge-word-problems","title":"🔥 Word problems challenge","challenge":true,"badge":"Word problems challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"number","level":"challenge","src":"M3","prompt":"Isaac swam 3 times as many laps as Mei. Together they swam 48 laps. How many laps did Isaac swim?","answer":[36],"hint":"Mei = 1 unit, Isaac = 3 units.","steps":["Mei 1 unit, Isaac 3 units → 4 units = 48.","1 unit = 48 ÷ 4 = 12.","Isaac = 3 × 12 = 36."],"explain":"4 units = 48, so 3 units = 36.","unit":"laps"},{"type":"number","level":"boss","src":"M1","prompt":"Isaac and Ben had the same number of cards. Isaac gave Ben 15 cards. Now Ben has how many MORE cards than Isaac?","answer":[30],"hint":"Isaac loses 15 AND Ben gains 15.","steps":["Isaac −15, Ben +15.","Difference = 15 + 15 = 30.","Draw two equal bars and move 15 across."],"explain":"The gap is 15 + 15.","unit":"cards"},{"type":"number","level":"boss","src":"M2","prompt":"A wushu class has 52 children. There are 8 more boys than girls. How many girls?","answer":[22],"hint":"Take away the extra 8 boys first.","steps":["Remove the extra 8: 52 − 8 = 44.","Now there are 2 equal parts: 44 ÷ 2 = 22 girls.","Boys = 22 + 8 = 30. Check: 22 + 30 = 52 ✔."],"explain":"22 girls, 30 boys.","unit":"girls"},{"type":"number","level":"boss","src":"M4","prompt":"Chickens and robot dogs: 10 heads and 32 legs. How many robot dogs (4 legs each)?","answer":[6],"hint":"Pretend they are all chickens first.","steps":["Suppose all 10 are chickens: 20 legs.","Missing legs: 32 − 20 = 12.","Each swap to a dog adds 2 legs → 12 ÷ 2 = 6 robot dogs, 4 chickens.","Check: 24 + 8 = 32 ✔."],"explain":"6 dogs and 4 chickens.","unit":"robot dogs"},{"type":"number","level":"boss","src":"M8","prompt":"Dad is 36 and Isaac is 8. In how many years will Dad be 3 times as old as Isaac?","answer":[6],"hint":"The age gap never changes.","steps":["The age gap is always 36 − 8 = 28.","Dad = 3 units, Isaac = 1 unit → gap = 2 units = 28 → 1 unit = 14.","Isaac will be 14 → 14 − 8 = 6 years."],"explain":"Gap stays 28.","unit":"years"},{"type":"number","level":"boss","src":"M15","prompt":"Isaac had some stickers. He gave away half, then got 6 more, and now has 20. How many did he have at first?","answer":[28],"hint":"Work backwards from 20.","steps":["Go backwards: 20 − 6 = 14.","Undo \"half\" → 14 × 2 = 28."],"explain":"Undo each step in reverse.","unit":"stickers"}]},{"id":"challenge-numbers","title":"🔥 Numbers & patterns challenge","challenge":true,"badge":"Numbers & patterns challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"number","level":"challenge","src":"M5","prompt":"What comes next? 3, 7, 15, 31, ?","answer":[63],"hint":"Look at the gaps: 4, 8, 16…","steps":["Each step is ×2 then +1.","31 × 2 + 1 = 63.","Or: the gaps 4, 8, 16 double → next gap is 32 → 31 + 32 = 63."],"explain":"Gaps double."},{"type":"mcq","level":"challenge","src":"M11","prompt":"Which is bigger, 3/4 or 5/8, and by how much?","options":["5/8, by 1/8","3/4, by 1/8","3/4, by 2/8","They are equal"],"answer":1,"hint":"Change 3/4 into eighths.","steps":["3/4 = 6/8.","6/8 > 5/8, by 1/8."],"explain":"3/4 = 6/8."},{"type":"number","level":"boss","src":"M6","prompt":"Fig 1 has 4 sticks (1 square). Fig 2 has 7 sticks (2 squares in a row). How many sticks for Fig 10?","answer":[31],"hint":"How many sticks does each new square add?","steps":["Each new square adds 3 sticks.","Fig 10 = 4 + 9 × 3 = 31."],"explain":"4 + 9 × 3.","unit":"sticks"},{"type":"number","level":"boss","src":"M10","prompt":"45 children go boating. Each boat holds 6. What is the FEWEST number of boats needed?","answer":[8],"hint":"What happens to the leftover children?","steps":["45 ÷ 6 = 7 remainder 3.","The 3 extra children still need a boat → 8 boats."],"explain":"Round UP for the leftover.","unit":"boats"},{"type":"number","level":"boss","src":"M12","prompt":"A robot kit has 24 parts. 1/3 are gears and 1/4 are wheels. How many parts are neither?","answer":[10],"hint":"Find the gears and the wheels first.","steps":["Gears: 24 ÷ 3 = 8.","Wheels: 24 ÷ 4 = 6.","Neither: 24 − 8 − 6 = 10."],"explain":"24 − 14 = 10.","unit":"parts"}]},{"id":"challenge-measurement","title":"🔥 Measurement challenge","challenge":true,"badge":"Measurement challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"number","level":"challenge","src":"M7","prompt":"A swim cap costs $4.60 and goggles cost $8.75. Isaac paid with a $20 note. How much change? (in $)","answer":[6.65,"6.65"],"hint":"Add first, then subtract from $20.","steps":["4.60 + 8.75 = 13.35.","20.00 − 13.35 = 6.65.","Change = $6.65."],"explain":"$20 − $13.35 = $6.65.","unit":"$"},{"type":"mcq","level":"challenge","src":"M9","prompt":"Wushu starts at 4.45 p.m. and lasts 1 h 35 min. Swimming starts 25 min after wushu ends. When does swimming start?","options":["6.20 p.m.","6.45 p.m.","6.35 p.m.","5.45 p.m."],"answer":1,"hint":"Add the hour, then the minutes.","steps":["4.45 + 1 h = 5.45.","5.45 + 35 min = 6.20 p.m. (wushu ends).","6.20 + 25 min = 6.45 p.m."],"explain":"Swimming starts at 6.45 p.m."},{"type":"number","level":"challenge","src":"M13","prompt":"A pool lane is 25 m. Isaac swims 6 lengths then 3 more. How many metres is that?","answer":[225],"hint":"How many lengths in total?","steps":["6 + 3 = 9 lengths.","9 × 25 = 225 m = 0 km 225 m (less than 1 km!).","Bonus: lengths for 1 km = 1000 ÷ 25 = 40."],"explain":"9 × 25 m.","unit":"m"},{"type":"number","level":"boss","src":"M14","prompt":"A square mat has a perimeter of 36 m. What is its area in m²?","answer":[81],"hint":"Find one side first.","steps":["A square has 4 equal sides: 36 ÷ 4 = 9 m.","Area = 9 × 9 = 81 m²."],"explain":"Side 9 m → 81 m².","unit":"m²"}]}]}]},{"id":"mandarin","name":"Mandarin","zh":"华文","icon":"🀄","color":"#dc2626","sectionLabel":"Term","blurb":"欢乐伙伴 三上 / 三下","terms":[{"id":"t1","name":"Term 1 · 三上","blurb":"Lessons 1–5","topics":[{"id":"school-life","title":"学校生活 School life","unit":"三上 L1–7","lesson":["Learn words for school life.",{"zh":"一辆车","py":"yí liàng chē","en":"one car (辆 for vehicles)"},{"zh":"一本书","py":"yì běn shū","en":"one book (本 for books)"},{"zh":"帮助","py":"bāngzhù","en":"to help"},{"zh":"迟到","py":"chídào","en":"to be late"},{"zh":"对不起","py":"duìbuqǐ","en":"sorry"},{"zh":"对不起，我不小心弄断了你的铅笔。","py":"Duìbuqǐ, wǒ bù xiǎoxīn nòng duàn le nǐ de qiānbǐ.","en":"Sorry, I accidentally broke your pencil."}],"questions":[{"type":"mcq","prompt":"Choose the measure word.","zh":"一＿车","py":"yí ＿ chē","en":"one car","options":[{"zh":"本","py":"běn"},{"zh":"辆","py":"liàng"},{"zh":"个","py":"gè"}],"answer":1,"hint":"车 is a vehicle. Vehicles take a special measure word.","steps":["Vehicles take 辆 liàng.","一辆车 yí liàng chē = one car."]},{"type":"mcq","prompt":"Choose the measure word.","zh":"一＿书","py":"yì ＿ shū","en":"one book","options":[{"zh":"辆","py":"liàng"},{"zh":"只","py":"zhī"},{"zh":"本","py":"běn"}],"answer":2,"hint":"Books take 本.","steps":["Books take 本 běn.","一本书 yì běn shū = one book."]},{"type":"mcq","prompt":"You broke your friend's pencil by accident. What do you say?","options":[{"zh":"对不起，我不小心弄断了你的铅笔。","py":"Duìbuqǐ, wǒ bù xiǎoxīn nòng duàn le nǐ de qiānbǐ.","en":"Sorry, I accidentally broke your pencil."},{"zh":"谢谢你的铅笔。","py":"Xièxie nǐ de qiānbǐ.","en":"Thanks for your pencil."},{"zh":"我喜欢铅笔。","py":"Wǒ xǐhuan qiānbǐ.","en":"I like pencils."}],"answer":0,"hint":"Start with 对不起 (sorry).","steps":["对不起 duìbuqǐ = sorry.","不小心 bù xiǎoxīn = by accident.","弄断了 nòng duàn le = broke."]},{"type":"mcq","prompt":"Choose the missing word.","zh":"我起床太晚了，上学＿＿了。","py":"Wǒ qǐchuáng tài wǎn le, shàngxué ＿＿ le.","en":"I got up too late, so I was ___ for school.","options":[{"zh":"迟到","py":"chídào","en":"late"},{"zh":"睡觉","py":"shuìjiào","en":"sleep"},{"zh":"帮助","py":"bāngzhù","en":"help"}],"answer":0,"extra":true,"hint":"Getting up late makes you ___ for school.","steps":["起床太晚 = got up too late.","So you are late: 迟到 chídào."]},{"type":"mcq","prompt":"What does this word mean?","zh":"帮助","py":"bāngzhù","options":["to sleep","to help","to be late","to answer"],"answer":1,"extra":true,"hint":"It is in the lesson list.","steps":["帮助 bāngzhù = to help.","Example: 我帮助妈妈。 Wǒ bāngzhù māma. = I help Mum."]}]}]},{"id":"t2","name":"Term 2 · 三上","blurb":"Lessons 6–9","topics":[]},{"id":"t3","name":"Term 3 · 三下","blurb":"Lessons 10–13","topics":[]},{"id":"t4","name":"Term 4 · 三下","blurb":"Lessons 14–17","topics":[]},{"id":"challenge","name":"🔥 Challenge & 👑 Boss","blurb":"Harder questions with worked solutions.","challenge":true,"topics":[{"id":"challenge-words","title":"🔥 词语与句子 Words & sentences challenge","challenge":true,"badge":"词语与句子 Words & sentences challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"challenge","src":"C1","prompt":"Which word means closest to 勇敢?","options":[{"zh":"害怕","py":"hàipà","en":"afraid"},{"zh":"大胆","py":"dàdǎn","en":"bold"},{"zh":"生气","py":"shēngqì","en":"angry"}],"answer":1,"hint":"勇敢 = 不怕 (not afraid).","steps":["勇敢 yǒnggǎn = 不怕 (not afraid).","大胆 dàdǎn 也是不怕 → B 大胆."],"explain":"勇敢 ≈ 大胆.","zh":"他非常勇敢地跳进水里。","py":"tā fēicháng yǒnggǎn de tiào jìn shuǐ li.","en":"He jumped into the water very bravely."},{"type":"mcq","level":"challenge","src":"C3","prompt":"Choose the joining words.","options":[{"zh":"因为…所以","py":"yīnwèi… suǒyǐ","en":"because… so"},{"zh":"虽然…但是","py":"suīrán… dànshì","en":"although… but"}],"answer":1,"hint":"累 and 练完 go in opposite directions.","steps":["\"累\" (tired) 和 \"练完\" (finished) 意思相反.","相反 → 用 虽然…但是.","虽然他很累，但是他还是练完了武术。"],"explain":"Opposite ideas → 虽然…但是.","zh":"他很累，（ ）他还是练完了武术。","py":"tā hěn lèi, ( ) tā háishì liàn wán le wǔshù.","en":"He was tired, ( ) he still finished wushu practice."},{"type":"mcq","level":"challenge","src":"C5","prompt":"Which sentence uses 一边……一边…… correctly?","options":[{"zh":"弟弟一边吃早餐，一边看书。","py":"dìdi yìbiān chī zǎocān, yìbiān kàn shū.","en":"Little brother eats breakfast while reading."},{"zh":"弟弟一边吃早餐。","py":"dìdi yìbiān chī zǎocān.","en":"(only one action)"},{"zh":"弟弟一边睡觉，一边跑步。","py":"dìdi yìbiān shuìjiào, yìbiān pǎobù.","en":"Sleeping while running (impossible)"}],"answer":0,"hint":"Two things done at the SAME time.","steps":["一边……一边…… = doing two things at the same time.","Both must be possible together: 吃早餐 + 看书 ✔.","弟弟一边吃早餐，一边看书。"],"explain":"Two actions at the same time.","zh":"用\"一边……一边……\"造句。","py":"yòng \"yìbiān… yìbiān…\" zàojù.","en":"Make a sentence with \"while… (doing)…\"."},{"type":"mcq","level":"challenge","src":"C8","prompt":"Which shows the two wrong characters fixed?","options":[{"zh":"游永→游泳，身休→身体","py":"yóuyǒng, shēntǐ","en":"泳 has the water radical; 体 is body"},{"zh":"游永→游咏，身休→身休","py":"","en":""},{"zh":"没有错字","py":"méiyǒu cuòzì","en":"no mistakes"}],"answer":0,"hint":"Swimming needs water: look for 氵.","steps":["游永 → 游泳 (泳 has the water radical 氵).","身休 → 身体 (体 = body)."],"explain":"泳 has 氵; 体 = body.","zh":"我每天都去游永，妈妈说游泳对身休很好。","py":"wǒ měitiān dōu qù yóuyǒng, māma shuō yóuyǒng duì shēntǐ hěn hǎo.","en":"I swim every day; Mum says swimming is good for the body."},{"type":"mcq","level":"boss","src":"C2","prompt":"Choose the correct measure words.","options":[{"zh":"个 / 个(台) / 根","py":"gè / gè (tái) / gēn"},{"zh":"本 / 只 / 个","py":"běn / zhī / gè"},{"zh":"根 / 本 / 辆","py":"gēn / běn / liàng"}],"answer":0,"hint":"Long thin things use 根.","steps":["一个游泳池.","一个 / 一台机器人.","一根棍子: long, thin things use 根."],"explain":"个, 个/台, 根.","zh":"一（ ）游泳池，一（ ）机器人，一（ ）棍子","py":"yí ( ) yóuyǒngchí, yí ( ) jīqìrén, yì ( ) gùnzi","en":"one pool, one robot, one stick"},{"type":"mcq","level":"boss","src":"C4","prompt":"Put the sentences in order.","options":["②④①③","④②①③","②①④③"],"answer":0,"hint":"Find time words like 最后 (finally).","steps":["先换衣服 ②.","→ 跳进 ④ → 游 ①.","→ 最后休息 ③.","答案: ②④①③."],"explain":"Change → jump → swim → rest.","zh":"① 他游了十个来回。② 小明换好泳衣。③ 最后他累得坐下来休息。④ 他跳进游泳池。","py":"① tā yóu le shí gè láihuí. ② Xiǎomíng huàn hǎo yǒngyī. ③ zuìhòu tā lèi de zuò xiàlái xiūxi. ④ tā tiào jìn yóuyǒngchí.","en":"① He swam ten laps. ② Xiaoming changed. ③ Finally he rested. ④ He jumped in."}]},{"id":"challenge-reading","title":"🔥 阅读理解 Reading challenge","challenge":true,"badge":"阅读理解 Reading challenge badge","lesson":["**Challenge set.** 🔥 questions are tricky. 👑 Boss questions are the hardest, and the Evil King guards each one.","Try first. Draw a model or table. Use the hint, then tap “Show me how” for the worked solution.","Original questions written for Isaac, modelled on Singapore P3 exam question types."],"questions":[{"type":"mcq","level":"boss","src":"C6","prompt":"How did 小华 feel before the race?","options":[{"zh":"紧张","py":"jǐnzhāng","en":"nervous"},{"zh":"生气","py":"shēngqì","en":"angry"},{"zh":"无聊","py":"wúliáo","en":"bored"}],"answer":0,"hint":"手一直在发抖 — why do hands shake?","steps":["线索 1: 手一直在发抖.","线索 2: 教练叫他\"别怕\".","所以他很紧张 (nervous)."],"explain":"Shaking hands + 别怕 → 紧张.","zh":"比赛那天，小华的手一直在发抖。教练拍拍他的肩膀说：\"别怕，你练习了很久。\"小华点点头，深深吸了一口气。","py":"bǐsài nà tiān, Xiǎohuá de shǒu yìzhí zài fādǒu. jiàoliàn pāi pāi tā de jiānbǎng shuō: \"bié pà, nǐ liànxí le hěn jiǔ.\" Xiǎohuá diǎn diǎn tóu, shēnshēn xī le yì kǒu qì.","en":"On race day, Xiaohua's hands kept shaking. The coach patted his shoulder: \"Don't be afraid, you have practised a long time.\" He nodded and took a deep breath."},{"type":"mcq","level":"boss","src":"C7","prompt":"Why did the coach say \"你练习了很久\"?","options":[{"zh":"想鼓励小华，让他有信心","py":"xiǎng gǔlì Xiǎohuá, ràng tā yǒu xìnxīn","en":"to encourage him and give him confidence"},{"zh":"想批评小华","py":"xiǎng pīpíng Xiǎohuá","en":"to scold him"},{"zh":"想叫小华回家","py":"xiǎng jiào Xiǎohuá huí jiā","en":"to send him home"}],"answer":0,"hint":"The coach patted his shoulder kindly.","steps":["教练想鼓励小华.","练习了很久 → 一定可以做好 → 有信心."],"explain":"To encourage him (鼓励).","zh":"教练说：\"别怕，你练习了很久。\"","py":"jiàoliàn shuō: \"bié pà, nǐ liànxí le hěn jiǔ.\"","en":"The coach said: \"Don't be afraid, you have practised a long time.\""}]}]}]}],"pastPapers":{"note":"The Challenge and Boss questions on this site are originals modelled on question types only; none are copied. The papers belong to the schools: use them at home for practice only and do not re-upload them. Links checked 27 Oct 2026 (SGT).","links":[{"title":"SG Test Paper: P3 hub","url":"https://www.sgtestpaper.com/p3/"},{"title":"SG Test Paper: 2025 P3 English","url":"https://www.sgtestpaper.com/primary/subject2025/y25p3english.html"},{"title":"SG Test Paper: 2025 P3 Maths","url":"https://www.sgtestpaper.com/primary/subject2025/y25p3maths.html"},{"title":"SG Test Paper: 2025 P3 Science","url":"https://www.sgtestpaper.com/primary/subject2025/y25p3science.html"},{"title":"SG Test Paper: 2025 P3 Chinese","url":"https://www.sgtestpaper.com/primary/subject2025/y25p3chinese.html"},{"title":"SG Test Paper: P3 MCQ practice","url":"https://sgtestpaper.com/mcq/primary_mcq.php#P3"},{"title":"Test Papers Free: P3","url":"https://www.testpapersfree.com/p3/"},{"title":"SGExam: P3 Maths","url":"https://sgexam.com/primary-3-maths/"},{"title":"SGExam: P3 Science","url":"https://sgexam.com/primary-3-science/"},{"title":"SGExam: P3 English","url":"https://sgexam.com/primary-3-english/"},{"title":"SGExam: P3 Chinese","url":"https://sgexam.com/primary-3-chinese/"}],"notUsed":"Not used: freetestpaper.com (blocked, 403); etestpaper.com (paid shop)."},"learnGuide":{"kid":[{"h":"Your daily training (20–30 minutes) 🥋","li":["**Warm-up (5 min):** Do 3 easy questions you got right before.","**Main training (15 min):** Pick ONE subject. Do 3–5 Challenge 🔥 questions.","**Fix-it time (5 min):** Look at your mistakes and try them again.","**Cool-down (2 min):** Tell someone one new thing you learnt."],"p":"Change subject each day: Science → Math → English → 华文 → your choice!"},{"h":"Try first, peek later 👀","li":["Read the question **two times**. Underline the key words.","Draw a model, a table or a picture.","Try for at least **3 minutes** before you tap “💡 Show me how”.","After a wrong answer you get a hint. Read it, then try again!","Stars: right first time = 3 ★, second try = 2 ★, later or after “Show me how” = 1 ★."]},{"h":"Mistakes make you stronger 💪","li":["A wrong answer is not bad. It shows you what to train.","Write the mistake in your **Fix-it notebook** (on paper).","Tap “💡 Show me how” and read the worked solution step by step.","Then **redo** the question by yourself with “Practise again”.","Try it again in 2 days. If you get it right, tick it off ✅."]},{"h":"Boss rounds and transforms 👑","li":["**Challenge 🔥** questions are tricky. **Boss 👑** questions are the hardest. Find them in “🔥 Challenge & 👑 Boss” at the bottom of each subject.","**Boss round:** the last question of every topic is a Boss round, and so is every 👑 question in a Challenge set. The Evil King blocks the way. Answer right and he retreats!","**Streak transform:** get 3 questions right on the first try in a row and Omega Prime transforms. It happens again at 5, then at 10, 20, 30… If you need another try or tap “Show me how”, the count starts again.","**Topic transform:** answer every question in a topic to win its badge, and Omega Prime transforms again.","**New forms:** Soldier mode from the start, Robot mode after 1 finished topic, Tank mode after 2, Jet mode after 4.","**Robot friends:** Horn Guard joins at a 3-in-a-row streak, Twin-Horn Scout at 5-in-a-row.","**Creatures grow with their Science topic:** Sproutling (living things), Flutterwing (life cycles), Polaroo (magnets). Stage 1 after 1 question solved, stage 2 after 3, the final form when you finish the topic.","Missed a Boss? No problem, there are no lives. Read the hint and try again right away, or tap “Show me how”. See everything in the 🛠 Hangar."]},{"h":"When to ask Mum or Dad 🙋","li":["You tried for 5 minu
