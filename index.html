tes, read the hint and “Show me how”, and you are still stuck.","You do not understand a word in the question.","You feel tired or upset. Take a break!","You beat a Boss. Tell them! 🎉"]}],"parent":["**Download:** open the past-paper links below. Pick P3, then the subject and paper. Save the PDF. Answer keys are usually at the back, so print the answers separately.","**Print:** print only the questions. Keep the answers with you.","**Timed practice:** start with one section (for example, Math word problems) in 20–30 min. Do a full paper only near WA/EOY.","**Mark together:** go through each mistake with him and ask \"What did the question ask? What was your plan?\" before you show the answer.","**Link back to the site:** if he keeps getting one type wrong (e.g. before/after, magnets, synthesis), do the matching Challenge/Boss set on the site (bottom of each subject).","**Pace:** 1–2 papers a week at most. Short, regular practice works better than long sessions.","**How the game works:** Boss = last question of each topic plus every 👑 question in Challenge sets. Omega Prime transforms after 3- and 5-in-a-row first-try streaks (then every 10) and on finishing a topic. Forms unlock at 0/1/2/4 finished topics; creatures grow with progress in their Science topic. Progress is saved on this device only."]},"chapters":[{"id":"underground","kind":"chapter","name":"The Underground Base","icon":"🕳️","color":"#7c4a1e","intro":"Omega Prime: The Underground Base. A chapter drawn by Isaac. Explore every room to win the Base Explorer badge!","credit":"Story and drawing by Isaac. Comic version made from his pencil page.","badge":"Underground Base Explorer","terms":[{"id":"rooms","name":"Rooms","topics":[{"id":"ant-nest","title":"🐜 Ant nest","icon":"🐜","lesson":["Ants are **living things** that live in soil.","Like all living things, ants need **air, water and food**.","Soil has tiny air spaces between its bits. Ants dig tunnels that let air in.","Ants carry food (seeds, crumbs, dead insects) back to the nest and drink tiny drops of water."],"questions":[{"type":"mcq","prompt":"Which three things do the ants in the nest need to stay alive?","options":["Only water","Air, water and food","Light, toys and sand","Only food"],"answer":1,"hint":"Think of what ALL living things need.","steps":["All living things need air, water and food.","Ants are living things, so they need all three."],"explain":"Air, water and food."},{"type":"mcq","prompt":"How does air reach ants deep in the soil?","options":["Through the rocks","The snail brings it","Through air spaces in the soil and their tunnels","Ants do not need air underground"],"answer":2,"hint":"Soil is not completely solid.","steps":["Soil has tiny air spaces between its bits.","Ant tunnels also let air flow in."],"explain":"Air spaces and tunnels."},{"type":"mcq","prompt":"Omega Prime floods the nest by mistake. Why is this bad for the ants?","options":["Water makes ants grow too fast","Ants cannot see in water","It is not bad at all","Water fills the air spaces, so the ants cannot get air"],"answer":3,"hint":"What takes the place of air when soil is flooded?","steps":["Water fills the air spaces in the soil.","Without air, the ants cannot breathe.","Ants need water, but not too much!"],"explain":"Too much water pushes the air out."}],"badge":"Ant nest explorer"},{"id":"snail-room","title":"🐌 Snail room","icon":"🐌","lesson":["A snail has a **3-stage life cycle**: egg → young snail → adult snail.","A young snail hatches from an egg and already has a tiny, soft shell.","The young snail looks like a small adult. It grows bigger and its shell grows with it.","Snails like damp, dark places, like Omega Prime's base!"],"questions":[{"type":"mcq","prompt":"What is the correct order of a snail's life cycle?","options":["Egg → young snail → adult snail","Egg → larva → pupa → adult","Young snail → egg → adult","Adult → pupa → egg"],"answer":0,"hint":"Snails do not have a pupa stage.","steps":["A snail starts as an egg.","A young snail hatches.","It grows into an adult."],"explain":"3 stages, no pupa."},{"type":"number","prompt":"How many stages are in a snail's life cycle?","answer":[3],"hint":"Count: egg, young snail, adult.","steps":["Egg (1), young snail (2), adult (3)."],"explain":"3 stages.","unit":"stages"},{"type":"mcq","prompt":"How is a young snail different from an adult snail?","options":["It lives in water with gills","It is smaller, but looks like the adult with a shell","It has wings","It has no shell at all and looks like a worm"],"answer":1,"hint":"Does a young snail look like its parent?","steps":["A young snail already has a small, soft shell.","It looks like a tiny adult and grows bigger."],"explain":"Same shape, just smaller."}],"badge":"Snail room explorer"},{"id":"bug-tunnel","title":"🪲 Bug tunnel","icon":"🪲","lesson":["Underground you find **living** and **non-living** things.","Living: beetles, worms, ants, plant roots, fungi. They need air, water and food, grow and reproduce.","Non-living: rocks, sand, water, metal ladders, Omega Prime's lamps.","Remember: a robot moves, but it is **not** alive. It does not grow or reproduce."],"questions":[{"type":"mcq","prompt":"Which of these in the bug tunnel is a LIVING thing?","options":["A metal ladder","A lamp","A beetle","A rock"],"answer":2,"hint":"Which one grows and reproduces?","steps":["A beetle needs air, water and food.","It grows and reproduces → living.","Rocks, ladders and lamps do not."],"explain":"The beetle is living."},{"type":"mcq","prompt":"Omega Prime moves and makes sounds. Is he a living thing?","options":["Yes, because he makes sounds","No, he does not grow or reproduce","Yes, because he moves"],"answer":1,"hint":"Moving alone does not make something living.","steps":["Living things grow and reproduce.","A robot does neither, even though it moves.","So Omega Prime is non-living."],"explain":"Moving is not enough."},{"type":"mcq","prompt":"Plant roots grow down into the tunnel ceiling. Roots are…","options":["Parts of a living thing","Non-living","A type of rock","A kind of fungus"],"answer":0,"hint":"Roots belong to a plant.","steps":["Roots are part of the tree above.","The tree is a living thing, so its roots are living parts."],"explain":"Roots are living parts."}],"badge":"Bug tunnel explorer"},{"id":"lift-shaft","title":"🧲 Lift shaft","icon":"🧲","lesson":["Omega Prime's lift uses **magnets**.","A magnet **attracts** (pulls) things made of iron or steel.","Two magnets: **like poles repel** (N–N or S–S push apart). **Unlike poles attract** (N–S pull together).","Turn the bottom magnet so like poles face each other, and the lift floats up!"],"questions":[{"type":"mcq","prompt":"The lift floats above a magnet in the floor. Which poles face each other?","options":["It is held by glue","North and North (like poles)","North and South (unlike poles)","No poles"],"answer":1,"hint":"Floating means they are pushing apart.","steps":["Pushing apart = repel.","Like poles repel, so N faces N (or S faces S)."],"explain":"Like poles repel."},{"type":"mcq","prompt":"The lift cage is made of steel. Which thing would a magnet NOT pull?","options":["An iron nail","A steel paper clip","A copper coin","A steel bolt"],"answer":2,"hint":"Not all metals are magnetic.","steps":["Magnets attract iron and steel.","Copper is a metal but not magnetic."],"explain":"Copper is not attracted."},{"type":"mcq","prompt":"Isaac flips the floor magnet so N faces S. What happens to the lift?","options":["It floats higher","Nothing changes","It is pulled down and sticks"],"answer":2,"hint":"Unlike poles…?","steps":["N and S are unlike poles.","Unlike poles attract, so the lift is pulled down."],"explain":"Unlike poles attract."}],"badge":"Lift shaft explorer"},{"id":"ladder-tunnel","title":"🪜 Ladder & tunnel","icon":"🪜","lesson":["We measure long lengths in **metres (m)** and short ones in **centimetres (cm)**.","**1 m = 100 cm.**","To add lengths: add metres to metres and cm to cm. If cm reaches 100, change it into 1 m.","To subtract: take away cm first. If there are not enough cm, change 1 m into 100 cm."],"questions":[{"type":"number","prompt":"Omega Prime climbs a ladder 4 m 50 cm long, then another 3 m 70 cm long. How far did he climb, in cm?","answer":[820],"hint":"Add m and cm, then change into cm.","steps":["4 m 50 cm + 3 m 70 cm = 7 m 120 cm.","120 cm = 1 m 20 cm → 8 m 20 cm.","8 m 20 cm = 800 + 20 = 820 cm."],"explain":"8 m 20 cm = 820 cm.","unit":"cm"},{"type":"number","prompt":"The tunnel is 10 m long. Omega Prime has walked 6 m 35 cm. How many cm are left?","answer":[365],"hint":"Change 10 m into 9 m 100 cm.","steps":["10 m = 9 m 100 cm.","9 m 100 cm − 6 m 35 cm = 3 m 65 cm.","3 m 65 cm = 365 cm."],"explain":"3 m 65 cm left.","unit":"cm"},{"type":"number","prompt":"One ladder step is 30 cm apart. How many cm are 8 steps?","answer":[240],"hint":"Multiply.","steps":["8 × 30 = 240 cm.","That is 2 m 40 cm."],"explain":"240 cm = 2 m 40 cm.","unit":"cm"}],"badge":"Ladder & tunnel explorer"},{"id":"rooms","title":"🟫 Base rooms","icon":"🟫","lesson":["**Area** = how many squares cover a shape. Count the squares inside.","**Perimeter** = the distance all the way around the edge. Add every side.","A rectangle room 4 squares long and 3 squares wide has area 4 × 3 = 12 squares.","Its perimeter is 4 + 3 + 4 + 3 = 14 units."],"questions":[{"type":"number","prompt":"The snail room is 5 squares long and 3 squares wide. What is its area, in squares?","answer":[15],"hint":"Count rows × columns.","steps":["3 rows of 5 squares.","5 × 3 = 15 squares."],"explain":"15 squares.","unit":"squares"},{"type":"number","prompt":"The same room is 5 units long and 3 units wide. What is its perimeter?","answer":[16],"hint":"Add all 4 sides.","steps":["5 + 3 + 5 + 3 = 16 units."],"explain":"16 units.","unit":"units"},{"type":"mcq","prompt":"Room A is 4 × 4 squares. Room B is 6 × 2 squares. Which room has the bigger area?","options":["Room A (16 squares)","Room B (12 squares)","Both the same"],"answer":0,"hint":"Work out both areas.","steps":["Room A: 4 × 4 = 16 squares.","Room B: 6 × 2 = 12 squares.","16 > 12, so Room A is bigger.","Trick: both have perimeter 16 units, but different areas!"],"explain":"Same perimeter, different areas."}],"badge":"Base rooms explorer"}]}]}],"themes":[{"id":"swim","kind":"theme","name":"Swim Lab","zh":"游泳实验室","icon":"🏊","color":"#0e7490","intro":"Why do things float? Each topic is a lap. Finish 4 laps to reach the gala podium!","pathName":"Lane path","guide":[{"mode":"Jet mode","text":"I fly over the Swim Lab and check your lap graphs from above. Smooth shapes slip easily through water!"},{"mode":"Tank mode","text":"Heavy and low, I never tip over. But in water? Shape and air decide if I float!"}],"safety":"An adult is present for every experiment. Wipe up spills. Nothing goes near the mouth. Never do water experiments in a pool or bath without an adult.","videos":[{"title":"Sink or Float?","channel":"SciShow Kids","length":"about 5:49","youtubeId":"eQuW8G2QV_Q","topic":"float-sink"},{"title":"Why Things Float!","channel":"SciShow Kids","youtubeId":"QCW0VQtQa-8","topic":"float-sink"}],"terms":[{"id":"science","name":"Science laps","topics":[{"id":"float-sink","title":"Why do things float or sink?","syllabus":"P3 syllabus: Diversity > Materials","badge":"Float Scientist","lesson":["Some materials float. Some sink.","Wood, cork and most plastics float. Steel, glass and stone sink.","Shape matters too. A steel ship floats because it is hollow and full of air.","A swimmer floats better after a deep breath. The lungs fill with air."],"funFact":"In the Dead Sea the water is so salty that people can lie on top of it and read a book.","experiments":[{"title":"Egg in salt water float test","need":["A glass of tap water","A raw egg","6–8 tablespoons of salt","A cork, a coin, a plastic spoon, a metal spoon, plasticine"],"steps":["Gently lower the egg into tap water. It sinks.","Take it out. Stir in 6 to 8 tablespoons of salt. Lower the egg in again.","Extra challenge: slowly pour tap water on top. Watch the egg hover in the middle.","Make a table: Object / Predict / Result. Test the other objects. Then shape the plasticine into a boat and test again."],"happened":"The egg floated in salt water. The plasticine ball sank, but the plasticine boat floated.","why":"Salty water pushes up more strongly. A boat shape holds air and spreads over more water."}],"questions":[{"type":"mcq","prompt":"A ball of plasticine sinks. The same plasticine shaped into a boat floats. What changed?","options":["The material","Only the shape","The weight doubled","The water got hotter"],"answer":1,"hint":"It is still the same plasticine.","steps":["The material is the same plasticine.","Only the shape changed.","The boat shape holds air and spreads out over more water, so it floats."]},{"type":"mcq","prompt":"Isaac floats more easily in the sea than in a swimming pool. Why?","options":["The sea is bigger","Sea water is salty, and salty water pushes up more strongly","The sea is colder","There are waves"],"answer":1,"hint":"Remember the egg test.","steps":["Sea water is salty.","Salty water pushes up more strongly.","Just like the egg in salt water, Isaac floats more easily."]},{"type":"mcq","prompt":"Which group has two materials that FLOAT?","options":["Wood and cork","Steel and glass","Stone and iron","Glass and stone"],"answer":0,"hint":"Think of a wooden peg and a bottle cork in water.","steps":["Floats: wood, cork, foam, most plastics.","Sinks: steel, iron, glass, stone.","So wood and cork float."]}]},{"id":"swimwear","title":"Swimwear and goggles: waterproof materials","syllabus":"P3 syllabus: Diversity > Materials and their properties","badge":"Waterproof Inspector","lesson":["Goggle lenses are clear plastic. They are waterproof, let light through and do not break easily.","The strap is silicone or rubber: waterproof, stretchy and flexible.","Swimsuits are nylon or polyester with spandex. They stretch, dry fast and do not soak up much water.","A cotton T-shirt soaks up water and gets heavy."],"funFact":"Some racing swimsuits were so slippery that they were banned in 2010 for giving swimmers an unfair advantage.","experiments":[{"title":"Waterproof test","need":["Cups","Rubber bands","Squares of cotton, old swimsuit fabric, plastic bag, paper and foil","A spoon and water","A kitchen scale"],"steps":["Put each square over a cup. Hold it on with a rubber band.","Drip 10 drops of water on each square.","Which ones let water through?","Weigh each fabric dry, then after a 1-minute soak."],"happened":"Water went through the cotton and paper. The plastic bag and foil kept it out. Cotton got the heaviest.","why":"Waterproof materials do not absorb water. Cotton absorbs a lot."}],"questions":[{"type":"mcq","prompt":"Why are goggle lenses NOT made of glass?","options":["Glass is too cheap","Glass can break and cut the eyes","Glass does not let light through","Glass floats"],"answer":1,"hint":"What happens if glass breaks near your eyes?","steps":["Glass can break and cut the eyes.","Plastic is waterproof, lets light through and is less likely to shatter."]},{"type":"mcq","prompt":"Which two properties does a goggle strap need?","options":["Waterproof and stretchy","Absorbent and stiff","Heavy and see-through","Soft and absorbent"],"answer":0,"hint":"It gets wet and has to fit snugly.","steps":["It must not soak up water: waterproof.","It must fit snugly: flexible and stretchy."]},{"type":"mcq","prompt":"Why is cotton a poor choice for a swimsuit?","options":["It is too colourful","It absorbs water, gets heavy and dries slowly","It is waterproof","It is too stretchy"],"answer":1,"hint":"Think of the cotton square in the test.","steps":["Cotton absorbs water.","It becomes heavy and slows the swimmer down.","It also dries slowly."]}]},{"id":"lungs","title":"Breathing and lungs","syllabus":"Bonus enrichment: the human body","bonus":true,"badge":"Lung Power Pro","lesson":["We breathe in air through the nose and mouth.","The air goes down to two lungs.","Swimmers breathe out bubbles underwater, then breathe in quickly when they turn their head.","Full lungs also help you float."],"funFact":"Adult lungs can hold about 6 litres of air. That is about three big drink bottles.","experiments":[{"title":"Bottle lung capacity","need":["A 2 L plastic bottle","A basin of water","A bendy straw for each person"],"steps":["Fill the bottle with water. Turn it upside down in the basin.","Push a bendy straw into the bottle's mouth.","Take one deep breath. Blow out through the straw.","Mark the new water level. Compare with a grown-up."],"happened":"Your breath pushed water out of the bottle. A grown-up pushed out more.","why":"Your lungs held that much air.","safety":"Use a clean straw for each person."}],"questions":[{"type":"text","prompt":"Which organ fills with air when we breathe in?","answer":["lungs","the lungs","lung"],"hint":"We have two of them in our chest.","steps":["Air goes in through the nose and mouth.","It travels down to the lungs."]},{"type":"mcq","prompt":"Why do swimmers blow bubbles underwater?","options":["To look cool","To empty the lungs, so they can breathe in quickly when the face comes up","To scare fish","To float lower"],"answer":1,"hint":"What do you need to do quickly when your face turns up?","steps":["Breathing out underwater empties the lungs.","Then they can breathe in quickly when the face turns."]},{"type":"mcq","prompt":"Why does a deep breath help you float?","options":["Air in the lungs is like a float inside you","It makes you heavier","It makes the water salty","It does not help"],"answer":0,"hint":"What is inside a float?","steps":["A float is full of air.","Air in your lungs makes your body lighter for its size.","So you float more easily."]}]},{"id":"frog-cycle","title":"Life cycle of a frog","syllabus":"P3 syllabus: Cycles > Life cycles of animals","badge":"Frog Life-Cycle Expert","lesson":["Egg (frogspawn) → tadpole → froglet → adult frog.","A tadpole has gills and a tail. It lives in water.","A froglet grows legs. Its tail shrinks.","An adult frog has lungs. It lives on land and in water.","Mosquito: egg → larva → pupa → adult. Its young live in water too."],"funFact":"The frog kick gave breaststroke (蛙泳, \"frog swim\") its leg action.","experiments":[{"title":"Tad the Tadpole comic","need":["Paper or the comic maker","Pencils"],"steps":["Draw 4 panels.","Panel 1: egg. Panel 2: tadpole. Panel 3: froglet. Panel 4: adult frog.","Tell the story of Tad learning to swim.","Optional: visit a pond with an adult. Look, but don't collect."],"happened":"Your comic shows all 4 stages in order.","why":"A frog's body changes a lot from egg to adult."}],"questions":[{"type":"mcq","prompt":"How does a tadpole breathe? How does an adult frog breathe?","options":["Tadpole: lungs. Frog: gills.","Tadpole: gills. Frog: lungs (and skin).","Both use gills.","Both use lungs."],"answer":1,"hint":"Tadpoles live only in water, like fish.","steps":["A tadpole breathes through gills.","An adult frog breathes through lungs and its skin."]},{"type":"mcq","prompt":"Which shows the 4 stages of a frog in order?","options":["Egg, froglet, tadpole, adult","Egg, tadpole, froglet, adult","Tadpole, egg, adult, froglet","Egg, larva, pupa, adult"],"answer":1,"hint":"Legs grow after the tadpole stage.","steps":["Egg first.","Then tadpole.","Then froglet (legs grow).","Then adult. That is 4 stages."]},{"type":"mcq","prompt":"How is a mosquito's life cycle like a frog's?","options":["Both have young that live in water","Both have wings","Both have only 2 stages","Both eat leaves"],"answer":0,"hint":"Where do mosquito larvae live?","steps":["Mosquito larvae live in water.","Tadpoles live in water.","Both have young that live in water."]}]}]},{"id":"english","name":"English","topics":[{"id":"last-lap","title":"Reading: The Last Lap","stretch":true,"badge":"Gala Reporter","lesson":["Read the story.","Look for similes (like ...) and adverbs (-ly words)."],"passage":["The whistle shrieked and six swimmers dived into the sparkling pool. Aiden kicked furiously, his arms slicing the water like windmill blades. Spray splashed everywhere as the crowd cheered loudly from the stands.","At the turn, he tucked, flipped and pushed off the wall powerfully. But by the third lap his legs felt like jelly. The boy in the next lane was creeping ahead, centimetre by centimetre.","\"Breathe, reach, kick,\" Aiden whispered to himself, remembering his coach's words. He stretched his arms further and kicked harder. Slowly, steadily, he drew level.","Both boys slammed their hands onto the wall at almost the same moment. Aiden gasped and looked up anxiously at the scoreboard. He had won by one hundredth of a second, less time than a blink."],"vocab":["shrieked","dived","slicing","tucked","flipped","creeping","slammed","gasped","furiously","powerfully","steadily","anxiously"],"comicPrompt":"In 6 panels, tell the race from the swimmer in the next lane's point of view. Include a simile, two adverbs and a thought bubble. Bonus: Omega Prime in jet mode films the race from above.","questions":[{"type":"mcq","prompt":"What signalled the start of the race?","options":["The crowd","The whistle","The scoreboard","The coach"],"answer":1,"hint":"Read the first sentence.","steps":["'The whistle shrieked and six swimmers dived'.","So the whistle started the race."]},{"type":"mcq","prompt":"What does \"his legs felt like jelly\" mean?","options":["His legs were very tired and weak","His legs were wobbly with excitement","He ate jelly","His legs were cold"],"answer":0,"hint":"It was the third lap of a hard race.","steps":["By the third lap he had kicked hard for a long time.","Jelly is soft and wobbly.","So his legs were very tired and weak."]},{"type":"mcq","prompt":"Why did Aiden whisper \"Breathe, reach, kick\"?","options":["To talk to the other boy","To remind himself of his coach's advice so he could speed up","Because he was scared of water","To count his laps"],"answer":1,"hint":"Whose words were they?","steps":["They were his coach's words.","He used them to keep his technique.","Then he stretched further and kicked harder."]},{"type":"mcq","prompt":"Find the simile in the first paragraph.","options":["\"sparkling pool\"","\"like windmill blades\"","\"cheered loudly\"","\"six swimmers\""],"answer":1,"hint":"A simile compares using 'like' or 'as'.","steps":["A simile uses 'like' or 'as'.","'His arms slicing the water like windmill blades.'"]},{"type":"mcq","prompt":"(Stretch) Why did the writer say \"less time than a blink\"?","options":["To show how close the race was, in a way we can imagine","Because Aiden blinked","Because the scoreboard was broken","To show the race was slow"],"answer":0,"hint":"One hundredth of a second is hard to picture.","steps":["One hundredth of a second is tiny.","Everyone knows how fast a blink is.","So we can imagine how close it was."]}]}]},{"id":"math","name":"Math","topics":[{"id":"lap-maths","title":"Lap maths","badge":"Lap Counter","lesson":["Use × for equal groups, like laps.","For time, count on to the next hour first.","Read the scale on a bar graph first."],"questions":[{"type":"number","prompt":"The pool is 25 m long. Isaac swims 12 laps. How many metres does he swim?","answer":[300],"unit":"m","hint":"12 laps of 25 m each: multiply.","steps":["12 × 25 = 300.","Isaac swims 300 m."]},{"type":"mcq","prompt":"Swimming starts at 0845 and lasts 45 min. Isaac then takes 20 min to change. When is he ready?","options":["0910","0930","0950 (9.50 a.m.)","1050"],"answer":2,"hint":"First add 45 min. Then add 20 min.","steps":["0845 + 45 min = 0930.","0930 + 20 min = 0950.","0950 is 9.50 a.m."]},{"type":"mcq","prompt":"Isaac's 25 m times: Mon 32 s, Wed 30 s, Fri 27 s, Sat 28 s. On which day was he fastest?","options":["Monday","Wednesday","Friday","Saturday"],"answer":2,"hint":"Fastest means the SMALLEST time.","steps":["The smallest time is 27 s.","That was Friday."]},{"type":"number","prompt":"How many seconds faster was Friday (27 s) than Monday (32 s)?","answer":[5],"unit":"s","hint":"Subtract the smaller time from the bigger time.","steps":["32 − 27 = 5.","Friday was 5 s faster."]},{"type":"number","prompt":"A coach shares 96 kickboards equally among 8 lanes. How many boards go in each lane?","answer":[12],"hint":"Share equally means divide.","steps":["96 ÷ 8 = 12.","Check: 8 × 12 = 96 ✓"]},{"type":"number","prompt":"A swim cap costs $8.50 and goggles cost $14.90. Isaac pays with $30. How much change does he get? (in $)","answer":[6.6],"unit":"$","hint":"Add the costs first, then subtract from $30.","steps":["$8.50 + $14.90 = $23.40.","$30.00 − $23.40 = $6.60."]}]}]},{"id":"mandarin","name":"华文","topics":[{"id":"swim-words","title":"游泳词语 Swim words","badge":"自由式 Freestyle Star","lesson":[{"zh":"游泳","py":"yóu yǒng","en":"to swim","ex":"我喜欢游泳。","exEn":"I like swimming."},{"zh":"游泳池","py":"yóu yǒng chí","en":"swimming pool","ex":"游泳池的水很清。","exEn":"The pool water is very clear."},{"zh":"自由式","py":"zì yóu shì","en":"freestyle","ex":"我的自由式游得很快。","exEn":"I swim freestyle very fast."},{"zh":"蛙泳","py":"wā yǒng","en":"breaststroke","ex":"蛙泳像青蛙一样踢水。","exEn":"Breaststroke kicks like a frog."},{"zh":"仰泳","py":"yǎng yǒng","en":"backstroke","ex":"仰泳的时候可以看天空。","exEn":"You can look at the sky when doing backstroke."},{"zh":"水花","py":"shuǐ huā","en":"splash","ex":"他跳水的时候水花很大。","exEn":"He made a big splash when he dived."},{"zh":"泳镜","py":"yǒng jìng","en":"swimming goggles","ex":"我戴上泳镜。","exEn":"I put on my goggles."},{"zh":"浮 / 沉","py":"fú / chén","en":"float / sink","ex":"木头会浮，石头会沉。","exEn":"Wood floats; stone sinks."},{"zh":"呼吸","py":"hū xī","en":"to breathe","ex":"游泳时要好好呼吸。","exEn":"Breathe well when you swim."}],"questions":[{"type":"mcq","prompt":"Fill in the blank.","zh":"我在____里游泳。","py":"Wǒ zài ____ lǐ yóuyǒng.","en":"I swim in the ___.","options":[{"zh":"游泳池","py":"yóu yǒng chí","en":"swimming pool"},{"zh":"泳镜","py":"yǒng jìng","en":"goggles"},{"zh":"水花","py":"shuǐ huā","en":"splash"}],"answer":0,"hint":"Where do you swim?","steps":["You swim IN a pool.","游泳池 yóu yǒng chí = swimming pool."]},{"type":"mcq","prompt":"Fill in the blank.","zh":"青蛙会____泳。","py":"Qīngwā huì ____ yǒng.","en":"Frogs can do ___stroke.","options":[{"zh":"仰","py":"yǎng"},{"zh":"蛙","py":"wā"},{"zh":"自","py":"zì"}],"answer":1,"hint":"青蛙 is frog. Breaststroke is 'frog swim'.","steps":["蛙 wā = frog.","蛙泳 wā yǒng = breaststroke, the 'frog swim'."]},{"type":"mcq","prompt":"What does this mean?","zh":"木头会浮，石头会沉。","py":"Mùtou huì fú, shítou huì chén.","options":["Wood floats; stone sinks.","Wood sinks; stone floats.","I like swimming.","The pool is clear."],"answer":0,"hint":"浮 fú = float. 沉 chén = sink.","steps":["木头 = wood. 会浮 = can float.","石头 = stone. 会沉 = can sink."]},{"type":"mcq","prompt":"Which word means \"swimming goggles\"?","options":[{"zh":"泳镜","py":"yǒng jìng"},{"zh":"呼吸","py":"hū xī"},{"zh":"仰泳","py":"yǎng yǒng"}],"answer":0,"hint":"镜 jìng is in the word for glasses and mirrors.","steps":["泳镜 yǒng jìng = swimming goggles.","呼吸 = breathe. 仰泳 = backstroke."]}]}]}]},{"id":"wushu","kind":"theme","name":"Wushu Dojo","zh":"武术馆","icon":"🥋","color":"#7c3aed","intro":"Stances, kicks and balance. Every topic earns a new sash colour!","pathName":"Belt path","guide":[{"mode":"Robot mode","text":"I am the dojo sensei. Watch my base widen! A low, wide stance is hard to push over."},{"mode":"Soldier mode","text":"马步! Hold! I am your drill coach for stances and Mandarin words."},{"mode":"Tank mode","text":"Heavy and low, I am impossible to tip. That is just like a horse stance."}],"safety":"An adult is present. Do wushu stances on a non-slip floor with space around you.","videos":[{"title":"Children Wushu: Ten Steps Routine (2/3)","channel":"WUSHU TV (IWUF)","length":"3:20","youtubeId":"I8J3okisD2w"},{"title":"Super Simple Machines: Levers","channel":"SciShow Kids","youtubeId":"lueqE0lxLyc","topic":"levers"},{"title":"Abby and Ernie Use a Lever","channel":"Sesame Workshop","length":"3:50","youtubeId":"gW2IRu-n2HU","topic":"levers"}],"terms":[{"id":"science","name":"Science sashes","topics":[{"id":"balance","title":"Balance and centre of gravity","syllabus":"Bonus enrichment: forces","bonus":true,"badge":"Horse Stance Master","lesson":["Your centre of gravity is your balance point. It is around your belly.","In 马步 (horse stance) your feet are wide and your knees are bent.","This lowers your centre of gravity and widens your base.","So you are very hard to push over."],"funFact":"Tightrope walkers carry long poles to help them balance.","experiments":[{"title":"Balance-stance test","need":["A grown-up","A non-slip floor","A timer","A tall empty bottle and a squat cup"],"steps":["Stand with feet together. A grown-up gently pushes your shoulder sideways. Do you wobble?","Now stand in a wide, low 马步. Get the same gentle push.","Time a one-leg stand (独立步) with eyes open, then eyes closed. Do 3 tries each.","Tap a tall bottle, then a squat cup. Which tips more easily?"],"happened":"Horse stance barely moved. The one-leg stand was harder with eyes closed. The tall bottle tipped first.","why":"A wide base and a low centre of gravity make things stable."}],"questions":[{"type":"mcq","prompt":"Why is a horse stance hard to push over?","options":["Wide feet make a big base, and bent knees lower the centre of gravity","Your arms are strong","You hold your breath","Your feet are together"],"answer":0,"hint":"Think about your base and how low you are.","steps":["Wide feet = bigger base.","Bent knees = lower centre of gravity.","Both make you stable."]},{"type":"mcq","prompt":"Why is a one-leg stand harder with your eyes closed?","options":["Your eyes help your brain sense balance","Your legs get weaker","It gets darker","It is not harder"],"answer":0,"hint":"What do your eyes tell your brain?","steps":["Your eyes help your brain sense balance.","Without them, your body relies on your inner ear and feet."]},{"type":"mcq","prompt":"Which is more stable?","options":["A tall thin vase","A short wide bowl"],"answer":1,"hint":"Low and wide, like a horse stance.","steps":["The bowl has a low centre of gravity.","It has a wide base.","So it is more stable."]}]},{"id":"forces","title":"Push and pull forces","syllabus":"Bonus enrichment: forces (links to P3 Magnets)","bonus":true,"badge":"Force Fist","lesson":["A force is a push or a pull.","A punch (冲拳) is a push. Pulling your fist back to your waist is a pull.","Forces can start or stop things, speed them up, slow them down, or change their direction or shape.","Magnets push (repel) and pull (attract) without touching."],"funFact":"Wushu athletes snap a punch back fast so the force is quick and the arm stays safe.","experiments":[{"title":"Punch the paper","need":["A sheet of tissue paper","Tape","A doorway","Two magnets"],"steps":["Tape the tissue so it hangs in a doorway.","Punch slowly towards it. Stop 5 cm away. Does it move?","Now punch fast and stop 5 cm away.","Try two magnets: make them push and pull without touching."],"happened":"The slow punch did nothing. The fast punch made the paper move.","why":"The fast punch pushed air, and the air pushed the paper. Magnets push and pull at a distance."}],"questions":[{"type":"mcq","prompt":"Is a front kick a push or a pull?","options":["A push","A pull"],"answer":0,"hint":"Your foot moves away from you.","steps":["The foot moves away from the body.","Moving something away is a push."]},{"type":"mcq","prompt":"Which of these can a force do to an object?","options":["Change its colour","Change its speed or direction","Change its smell","Make it alive"],"answer":1,"hint":"Forces affect how things move and their shape.","steps":["Forces can start or stop things.","They can change speed and direction.","They can change shape."]},{"type":"mcq","prompt":"Which force acts without touching?","options":["A magnet","A punch"],"answer":0,"hint":"Remember the magnet experiment.","steps":["Magnetic force can act at a distance.","A punch must touch (or push air)."]}]},{"id":"levers","title":"Arms as levers","syllabus":"Bonus enrichment: simple machines","bonus":true,"badge":"Lever Lord","lesson":["A lever is a bar that turns on a pivot, called the fulcrum.","Your forearm is a lever. Your elbow is the fulcrum.","A 棍 (staff) is a long lever. Hold it in the middle and swing: the ends move fast."],"funFact":"A pair of chopsticks is a lever too, with your fingers as the fulcrum.","experiments":[{"title":"Ruler lever","need":["A 30 cm ruler","A pencil","A small toy"],"steps":["Put the pencil under the ruler as the fulcrum.","Put the toy on one end.","Press the other end to lift the toy.","Move the pencil closer to the toy, then farther away."],"happened":"Lifting was easiest when the pencil was close to the toy.","why":"A fulcrum close to the load makes lifting easier."}],"questions":[{"type":"mcq","prompt":"In your arm, where is the fulcrum?","options":["The wrist","The elbow joint","The fingers","The shoulder blade"],"answer":1,"hint":"Where does your forearm turn?","steps":["Your forearm turns at the elbow.","So the elbow is the fulcrum."]},{"type":"mcq","prompt":"Where should the fulcrum go to make lifting easier?","options":["Closer to the load","Farther from the load"],"answer":0,"hint":"Think of the ruler test.","steps":["In the ruler test, lifting was easiest with the pencil close to the toy.","So put the fulcrum closer to the load."]},{"type":"mcq","prompt":"Which two are levers at home?","options":["Scissors and a seesaw","A pillow and a towel","A cup and a plate","A sock and a hat"],"answer":0,"hint":"Which ones turn on a pivot?","steps":["Scissors turn on a pivot.","A seesaw turns on a pivot.","So they are levers."]}]},{"id":"muscles-bones","title":"Muscles and bones","syllabus":"Bonus enrichment: the human body","bonus":true,"badge":"Bone & Muscle Medic","lesson":["Bones give the body shape and protect it. The skull protects the brain.","Muscles pull on bones to move them.","Muscles work in pairs: the biceps bends the elbow, the triceps straightens it.","Stretching before wushu warms up the muscles."],"funFact":"Adults have 206 bones. Babies are born with about 300, and some join up later.","experiments":[{"title":"Feel your muscles","need":["Your arms","A timer"],"steps":["Hold your upper arm with your other hand.","Bend your elbow slowly. Feel the biceps get hard.","Straighten it. Feel the triceps get hard.","Time your 马步 on Day 1 and on Day 7."],"happened":"One muscle got hard when you bent your arm, and the other when you straightened it.","why":"Muscles can only pull, so they work in pairs."}],"questions":[{"type":"mcq","prompt":"Muscles can only ___ bones.","options":["push","pull"],"answer":1,"hint":"That is why they work in pairs.","steps":["Muscles can only pull.","So one muscle bends a joint and its partner straightens it."]},{"type":"text","prompt":"Which bone protects the brain?","answer":["skull","the skull"],"hint":"It is the bone of your head. Starts with s.","steps":["The brain is inside the head.","The skull protects it."]},{"type":"mcq","prompt":"Why do wushu athletes warm up?","options":["Warm muscles stretch more easily and are less likely to get hurt","To get sweaty","To get tired first","To look taller"],"answer":0,"hint":"Think about safety.","steps":["Warm muscles stretch more easily.","So they are less likely to get hurt."]}]}]},{"id":"english","name":"English","topics":[{"id":"silver-staff","title":"Reading: The Silver Staff","stretch":true,"badge":"Staff Spinner","lesson":["Read the story.","Notice the action verbs and the -ly adverbs."],"passage":["Wei Jie tightened the red sash around his waist and peered nervously across the hall. Rows of judges sat perfectly still behind a long table. When his name echoed through the speakers, he strode onto the carpet and bowed respectfully.","He sank into a deep horse stance. Then the staff began to whirl. It sliced through the air, whistled past his ear and spun so rapidly that it blurred into a silver circle. Wei Jie leapt, twisted gracefully and landed silently on one foot.","Halfway through, his grip slipped. The staff wobbled dangerously. For one terrible second, Wei Jie thought it would clatter to the floor. He clenched his teeth, caught it firmly and carried on as if nothing had happened.","When he finished, he bowed again, breathing heavily. He did not win gold that day. But as Coach Lim patted his shoulder, she said quietly, \"Champions are not people who never slip. They are people who never stop.\""],"vocab":["tightened","peered","strode","whirl","sliced","leapt","clenched","nervously","rapidly","gracefully","firmly"],"comicPrompt":"In 6 panels, draw Wei Jie's routine. Use at least 4 action verbs and 2 adverbs, and one sound word (WHOOSH!). Bonus: Omega Prime cheers in the last panel.","questions":[{"type":"mcq","prompt":"How did Wei Jie feel at the start?","options":["Nervous","Bored","Angry","Sleepy"],"answer":0,"hint":"Look at how he 'peered' across the hall.","steps":["He 'peered nervously'.","So he felt nervous."]},{"type":"mcq","prompt":"What does \"blurred into a silver circle\" tell us about the staff?","options":["It was spinning so fast you could not see its shape clearly","It was broken","It was painted silver","It was very heavy"],"answer":0,"hint":"When things move very fast, they look blurry.","steps":["It 'spun so rapidly'.","Fast spinning makes a blur.","So you could not see its shape clearly."]},{"type":"mcq","prompt":"What problem happened, and how did he solve it?","options":["His grip slipped; he caught the staff firmly and carried on","He fell; he stopped the routine","He forgot the moves; the coach helped","The music stopped; he waited"],"answer":0,"hint":"Read paragraph 3.","steps":["'His grip slipped. The staff wobbled.'","'He caught it firmly and carried on.'"]},{"type":"mcq","prompt":"What did Coach Lim mean?","options":["Mistakes are normal; a champion does not give up","Champions never make mistakes","You must win gold","Stop practising"],"answer":0,"hint":"'never slip' vs 'never stop'.","steps":["Everyone slips sometimes.","What matters is not stopping.","So: keep going after a mistake."]},{"type":"mcq","prompt":"(Stretch) Was the ending happy or sad?","options":["Both: he did not win gold, but he kept going and his coach was proud","Only sad","Only happy because he won gold","Neither"],"answer":0,"hint":"Did he win? How did the coach act?","steps":["He did not win gold: sad.","He learned to keep going and his coach was proud: happy.","So it is both."]}]}]},{"id":"math","name":"Math","topics":[{"id":"dojo-maths","title":"Dojo maths: time and bar models","lesson":["For durations, count on to the next hour first.","60 s = 1 min.","For comparison problems, draw two bars."],"questions":[{"type":"mcq","prompt":"Wushu training starts at 1530 and ends at 1715. How long is it?","options":["1 h 15 min","1 h 45 min","2 h 15 min","1 h 85 min"],"answer":1,"hint":"Count from 1530 to 1700, then to 1715.","steps":["1530 → 1700 is 1 h 30 min.","1700 → 1715 is 15 min.","Total: 1 h 45 min."]},{"type":"number","prompt":"Isaac did 145 punches. His sister did 68 fewer. How many punches did they do altogether?","answer":[222],"hint":"First find his sister's punches: 145 − 68.","barModel":{"bars":[{"label":"Isaac","parts":[{"value":145,"label":"145","tone":"a"}]},{"label":"Sister","parts":[{"value":77,"label":"","tone":"a"},{"value":68,"label":"68 fewer","tone":"gap"}]}],"brackets":[{"from":0,"to":1,"label":"?"}]},"steps":["Sister: 145 − 68 = 77.","Altogether: 145 + 77 = 222.","They did 222 punches."]},{"type":"mcq","prompt":"Isaac holds horse stance for 1 min 25 s on Monday, and 40 s longer on Tuesday. How long altogether?","options":["2 min 5 s","2 min 65 s","3 min 30 s","3 min 5 s"],"answer":2,"hint":"Find Tuesday first. Remember 60 s = 1 min.","steps":["Tuesday: 1 min 25 s + 40 s = 1 min 65 s = 2 min 5 s.","Total: 1 min 25 s + 2 min 5 s = 3 min 30 s."]}]}]},{"id":"mandarin","name":"华文","topics":[{"id":"wushu-words","title":"武术词语 Wushu words","badge":"武术小将 Little Wushu General","lesson":[{"zh":"武术","py":"wǔ shù","en":"wushu","ex":"我每个星期六学武术。","exEn":"I learn wushu every Saturday."},{"zh":"打拳","py":"dǎ quán","en":"to practise a fist routine","ex":"哥哥在公园里打拳。","exEn":"My brother practises his fist routine in the park."},{"zh":"剑","py":"jiàn","en":"sword","ex":"老师的剑很亮。","exEn":"The teacher's sword is very shiny."},{"zh":"棍","py":"gùn","en":"staff, stick","ex":"他把棍转得很快。","exEn":"He spins the staff very fast."},{"zh":"刀","py":"dāo","en":"broadsword","ex":"姐姐用刀表演。","exEn":"My sister performs with a broadsword."},{"zh":"马步","py":"mǎ bù","en":"horse stance","ex":"我能蹲马步一分钟。","exEn":"I can hold a horse stance for one minute."},{"zh":"踢腿","py":"tī tuǐ","en":"to kick","ex":"我们先踢腿，再打拳。","exEn":"We kick first, then practise fists."},{"zh":"教练","py":"jiào liàn","en":"coach","ex":"教练说我进步了。","exEn":"The coach says I have improved."},{"zh":"比赛","py":"bǐ sài","en":"competition","ex":"明天我要参加武术比赛。","exEn":"Tomorrow I will take part in a wushu competition."}],"questions":[{"type":"mcq","prompt":"Fill in the blank.","zh":"他蹲____蹲了两分钟。","py":"Tā dūn ____ dūn le liǎng fēnzhōng.","en":"He held a ___ for two minutes.","options":[{"zh":"马步","py":"mǎ bù","en":"horse stance"},{"zh":"剑","py":"jiàn","en":"sword"},{"zh":"教练","py":"jiào liàn","en":"coach"}],"answer":0,"hint":"蹲 dūn means squat. What do you hold in a squat?","steps":["蹲马步 = hold a horse stance.","他蹲马步蹲了两分钟。"]},{"type":"mcq","prompt":"Which word means \"coach\"?","options":[{"zh":"比赛","py":"bǐ sài"},{"zh":"教练","py":"jiào liàn"},{"zh":"武术","py":"wǔ shù"}],"answer":1,"hint":"教 jiào means teach.","steps":["教练 jiào liàn = coach.","比赛 = competition. 武术 = wushu."]},{"type":"mcq","prompt":"What does this mean?","zh":"他把棍转得很快。","py":"Tā bǎ gùn zhuàn de hěn kuài.","options":["He spins the staff very fast.","He kicks very high.","The sw <script>/* Hint engine: builds an illustrated, step-by-step guide for any question from its data. SVG only, original art. */
window.HINTS=(function(){
"use strict";
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var CUR=[],PROMPT='';
/* ---------- answer masking ---------- */
function answers(q){
  var out=[];
  if(q.type==='mcq'){var op=q.options[q.answer];if(typeof op==='string')out.push(op);else['zh','py','en'].forEach(function(k){if(op[k])out.push(op[k])})}
  else (q.answer||[]).forEach(function(a){out.push(String(a));if(typeof a==='number'&&a>=1000)out.push(String(a).replace(/\B(?=(\d{3})+$)/,' '))});
  var more=[];out.forEach(function(a){var b=a.replace(/^["'“]+|["'”]+$/g,'');if(b!==a)more.push(b)});
  return out.concat(more).filter(function(a){return a&&a.trim()});
}

    app.querySelectorAll('.panel').forEach(function(pn){pn.addEventListener('pointerdown',function(e){if(e.target===pn||e.target.classList.contains('pnum')){sel={p:+pn.dataset.p,i:-1};draw()}})});

    app.querySelectorAll('.item').forEach(function(el){
      el.addEventListener('pointerdown',function(e){

        if(sel.p!==p||sel.i!==i){sel={p:p,i:i};app.querySelectorAll('.item.sel,.panel.sel').forEach(function(z){z.classList.remove('sel')});el.classList.add('sel');pn.classList.add('sel')}
        el.setPointerCapture(e.pointerId);
        function mv(ev){moved=true;var it=S.panels[p].items[i];it.x=Math.max(5,Math.min(95,(ev.clientX-r.left)/r.width*100));it.y=Math.max(5,Math.min(95,(ev.clientY-r.top)/r.height*100));el.style.left=it.x+'%';el.style.top=it.y+'%'}

  function exportPNG(){
    var cols=S.n===4?2:S.n===6?3:S.n,rows=S.n===4||S.n===6?2:1,PW=480,PH=360,G=16,cv=document.createElement('canvas');
    cv.width=cols*PW+(cols+1)*G;cv.height=rows*PH+(rows+1)*G;var x=cv.getContext('2d');x.fillStyle='#fff8ec';x.fillRect(0,0,cv.width,cv.height);
    var imgs={},pending=0;chars().forEach(function(c){pending++;var im=new Image();im.onload=im.onerror=function(){if(--pending===0)paint()};im.src=c.src;imgs[c.id]=im});
    function wrap(t,maxw){var w=String(t).split(/(\s+)/),lines=[],cur='';w.forEach(function(s){if(x.measureText(cur+s).width>maxw&&cur.trim()){lines.push(cur.trim());cur=s.trim()}else cur+=s});if(cur.trim())lines.push(cur.trim());
      return lines.reduce(function(o,l){if(x.measureText(l).width<=maxw)o.push(l);else{var c='';l.split('').forEach(function(ch){if(x.measureText(c+ch).width>maxw){o.push(c);c=ch}else c+=ch});o.push(c)}return o},[])}
    function paint(){
      for(var p=0;p<S.n;p++){var ox=G+(p%cols)*(PW+G),oy=G+Math.floor(p/cols)*(PH+G);
        x.fillStyle='#fff';x.fillRect(ox,oy,PW,PH);x.lineWidth=5;x.strokeStyle='#1d2340';x.strokeRect(ox,oy,PW,PH);
        S.panels[p].items.forEach(function(it){var cx=ox+it.x/100*PW,cy=oy+it.y/100*PH;
          if(it.type==='char'){var im=imgs[it.img];if(!im||!im.width)return;var h=PH*0.45*(it.s||1),w=im.width/im.height*h;x.save();x.translate(cx,cy);if(it.f)x.scale(-1,1);x.drawImage(im,-w/2,-h/2,w,h);x.restore();return}
          x.font=(it.type==='caption'?'bold 18px':'bold 20px')+' system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif';
          var ls=wrap(it.text||'',PW*0.5),lh=24,bw=Math.max.apply(null,ls.map(function(l){return x.measureText(l).width}).concat([20]))+24,bh=ls.length*lh+14,bx=cx-bw/2,by=cy-bh/2;
          var tb=it.type!=='caption';x.lineWidth=3;x.fillStyle=it.type==='shout'?'#fde047':tb?'#fff':'#ffe680';x.beginPath();
          if(it.type==='think')x.ellipse(cx,cy,bw/2+10,bh/2+6,0,0,7);else if(it.type==='shout'){for(var k=0;k<20;k++){var an=k/20*6.283,rr=k%2?1:1.22;x.lineTo(cx+Math.cos(an)*(bw/2+8)*rr,cy+Math.sin(an)*(bh/2+8)*rr)}x.closePath()}else if(x.roundRect)x.roundRect(bx,by,bw,bh,tb?20:2);else x.rect(bx,by,bw,bh);x.fill();x.stroke();
          if(it.type==='think'){[[.3,14,7],[.22,26,4]].forEach(function(d){x.beginPath();x.arc(bx+bw*d[0],by+bh+d[1],d[2],0,7);x.fillStyle='#fff';x.fill();x.stroke()})}
          if(it.type==='bubble'){x.beginPath();x.moveTo(bx+bw*0.3,by+bh-2);x.lineTo(bx+bw*0.3+6,by+bh+16);x.lineTo(bx+bw*0.3+18,by+bh-2);x.fillStyle='#fff';x.fill();x.stroke()}
          x.fillStyle='#1d2340';x.textAlign='center';ls.forEach(function(l,k){x.fillText(l,cx,by+7+lh*(k+0.8))})});
      }
      cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='isaac-comic.png';document.body.appendChild(a);a.click();a.remove();document.getElementById('cmsg').textContent='PNG saved to Downloads ✔'});
    }
  }
  draw();
}

/* ===== Drag & drop helper (pointer drag, plus tap-to-pick, tap-to-drop) ===== */
function dnd(root,onDrop){
  var picked=null;
  root.querySelectorAll('.drag').forEach(function(el){
    el.addEventListener('pointerdown',function(e){if(el.classList.contains('locked'))return;e.preventDefault();var sx=e.clientX,sy=e.clientY,moved=false;el.setPointerCapture(e.pointerId);el.classList.add('lift');
      function mv(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.08) rotate(-3deg)'}
      function up(ev){el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.classList.remove('lift');el.style.transform='';
        if(moved){el.style.visibility='hidden';var t=document.elementFromPoint(ev.clientX,ev.clientY);el.style.visibility='';var z=t&&t.closest('.dz');if(z&&root.contains(z))onDrop(el,z)}
        else{if(picked)picked.classList.remove('picked');picked=picked===el?null:el;if(picked){el.classList.add('picked');SND.pop()}}}
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(picked)picked.classList.remove('picked');picked=el;el.classList.add('picked')}});
  });
  root.querySelectorAll('.dz').forEach(function(z){z.addEventListener('click',function(e){if(picked&&!e.target.closest('.drag')){var p=picked;picked.classList.remove('picked');picked=null;onDrop(p,z)}})});
}

  function hit(){var mvn=MOVES[(v.hp-vhp)%MOVES.length];vhp--;SND.zap();setTimeout(SND.hit,180);anim('om','attack');anim('vm','hurt');document.getElementById('vm').innerHTML=villainSVG(v,'hurt');setTimeout(function(){if(vhp>0)document.getElementById('vm').innerHTML=villainSVG(v,'')},700);

  im.onerror=function(){URL.revokeObjectURL(u);cb('Could not read that picture.')};im.src=u}

    o.querySelector('#hx').onclick=close;o.querySelector('#hprev').onclick=function(){if(i>0){i--;draw()}};

  window.addEventListener('hashchange',function h(){window.removeEventListener('hashchange',h);if(o.parentNode)close()});
  draw();
}

    o.querySelector('#tug').addEventListener('submit',function(e){e.preventDefault();if(+o.querySelector('#tg').value===a*b-17){sessionStorage.setItem('isaac.parent','1');addBonus()}else o.querySelector('#tgm').textContent='That is not right.'});
  }
  function addBonus(){S=get();S.bonus+=15;persist();var o=document.querySelector('.timesup');if(o)o.remove();document.body.classList.remove('locked');shown=false;paint()}
  function tick(){if(document.hidden)return;var n=get();if(n.day!==S.day)S=n;S.used++;persist();if(window.__statTick)window.__statTick();
    var l=left();if(l<=300&&l>0&&!S.warned){S.warned=1;persist();toast('⏱ 5 minutes left today. Time to finish this topic!')}
    if(l<=0){persist();timesUp()}paint()}
  function start(){el=document.getElementById('timeLeft');paint();if(left()<=0)timesUp();RAW_CI(t);t=RAW_SI(tick,1000);
    document.addEventListener('visibilitychange',function(){persist()});window.addEventListener('pagehide',function(){persist()})}
  return {start:start,addBonus:addBonus,left:left};
})();
window.__timer=Timer;

/* ---------- router ---------- */
function route(){
  var raw=location.hash.replace(/^#\/?/,''),parts=raw.split('?'),seg=parts[0].split('/').filter(Boolean),q=parts[1]||'';
  var back=document.getElementById('backBtn'); back.hidden=seg.length===0;
  updTop();
  try{
    if(!seg.length)home();
    else if(seg[0]==='parents')parents();
    else if(seg[0]===LV&&seg[1]==='comic')comic(q);
    else if(seg[0]===LV&&seg[1]==='hangar')hangar();
    else if(seg[0]===LV&&seg[1]==='studio')studio();
    else if(seg[0]===LV&&seg[1]==='teach')teacher();
    else if(seg[0]===LV&&seg[1]==='brother')brother(seg[2]);
    else if(seg[0]===LV&&seg[1]==='daily')daily();
    else if(seg[0]===LV&&seg[1]==='build')build(seg[2]);
    else if(seg[0]==='report')report();
    else if(seg[0]===LV&&seg[1]==='draw')drawPad();
    else if(seg[0]===LV&&seg[1]==='guide')guide();
    else if(seg[0]===LV&&seg[1]==='awards')awards();
    else if(seg[0]===LV&&seg[1]==='work')workPage(q);
    else if(seg[0]===LV&&seg[1]==='robots')robotHQ();
    else if(seg[0]===LV&&seg[1]==='lab')(seg[2]==='plant'?simPlant:seg[2]==='magnet'?simMagnet:seg[2]==='cycle'?simCycle:labHub)();
    else if(seg[0]===LV&&seg[1]==='tinker')(seg[2]?tinker(seg[2]):tinkerHub());
    else if(seg[0]===LV&&seg[1]==='battle')(seg[2]?battle(seg[2]):arenaHub());
    else{
      var node=NODES[seg[1]]; if(seg[0]!==LV||!node){home();return}
      if(seg.length===2)hub(node);
      else{var o=findTopic(node,seg[2]); if(!o){hub(node);return}
        if(seg[3]==='q')question(node,o,parseInt(seg[4],10)||1);
        else if(seg[3]==='done')done(node,o);
        else lesson(node,o);}
    }
    try{wrSync()}catch(e){}
  }catch(e){app.innerHTML='<p>Oops, something went wrong.</p><pre>'+esc(e.message)+'</pre>';throw e}
  if(/(^|&)map/.test(q)&&document.getElementById('map'))document.getElementById('map').scrollIntoView();else window.scrollTo(0,0); app.focus({preventScroll:true});
}
document.getElementById('backBtn').addEventListener('click',function(){
  var seg=location.hash.replace(/^#\/?/,'').split('?')[0].split('/').filter(Boolean);
  if(history.length>1&&document.referrer!==null&&window.__nav>0){history.back();return}
  seg.length>2?go('#/'+seg.slice(0,seg[3]==='q'||seg[3]==='done'?3:2).join('/')):go('#/');
});
window.__nav=0; window.addEventListener('hashchange',function(){window.__nav++;leavePage();route()});
document.getElementById('homeLink').addEventListener('click',function(e){if(location.hash.replace(/^#\/?/,'')===''){e.preventDefault();leavePage();route()}});
document.getElementById('brandImg').src=A.omega;
route();
Timer.start();
})();
</script>
